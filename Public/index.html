<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DREAMENGIN – All-in-One</title>
  <style>
    :root{--bg:#0b0b10;--glass:rgba(255,255,255,.05);--accent:#00f2ff;--purple:#a855f7;--error:#ff4d4d}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#eaeaf2;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#1e1e3f,var(--bg))}
    .glass{background:var(--glass);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:2.5rem;width:90%;max-width:500px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
    .logo{font-size:2.5rem;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:1.5rem;animation:glow 2s ease-in-out infinite alternate}
    @keyframes glow{from{text-shadow:0 0 10px var(--accent),0 0 20px var(--purple)}to{text-shadow:0 0 20px var(--accent),0 0 40px var(--purple)}}
    label{display:block;margin-top:1rem;font-size:.9rem;opacity:.8}
    input,textarea{width:100%;padding:.75rem;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.2);color:#fff;margin-top:.5rem}
    textarea{resize:vertical;min-height:120px}
    .btn{width:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border:none;color:#000;font-weight:700;padding:.75rem;border-radius:8px;cursor:pointer;margin-top:1.5rem;transition:transform .2s ease}
    .btn:hover{transform:scale(1.05)}
    .error{color:var(--error);font-size:.8rem;margin-top:.5rem}
    .hidden{display:none}
    footer{margin-top:auto;padding:1rem;text-align:center;font-size:.75rem;opacity:.6}
    a{color:var(--accent);text-decoration:none}
    .toggle{display:flex;gap:.5rem;margin-bottom:1.5rem}
    .toggle button{flex:1;background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff}
    .toggle button.active{background:var(--accent);color:#000;border-color:var(--accent)}
    pre{background:rgba(0,0,0,.2);padding:1rem;border-radius:8px;margin-top:1rem;font-size:.8rem;white-space:pre-wrap;max-height:200px;overflow:auto}
  </style>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" />
</head>
<body>
  <!-- ==========  LANDING / LOGIN / CREATE  ========== -->
  <div id="landing" class="glass">
    <div class="logo">DREAMENGIN</div>
    <p style="text-align:center;opacity:.85;margin-bottom:1.5rem">AI-assisted legal drafting, compliance checks, and auto-PR updates.</p>

    <div class="toggle">
      <button id="loginTab" class="active" onclick="switchTab('login')">Login</button>
      <button id="createTab" onclick="switchTab('create')">Create Account</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <label>Username
        <input id="user" type="text" placeholder="your name" required />
      </label>
      <label>Password
        <input id="pass" type="password" placeholder="password" required />
      </label>
      <button type="submit" class="btn">Login</button>
      <div id="loginError" class="error hidden"></div>
    </form>

    <!-- CREATE ACCOUNT -->
    <form id="createForm" class="hidden" onsubmit="handleCreate(event)">
      <label>Choose username
        <input id="newUser" type="text" placeholder="new name" required />
      </label>
      <label>Create password
        <input id="newPass" type="password" placeholder="new password" required />
      </label>
      <button type="submit" class="btn">Create & Go</button>
      <div id="createError" class="error hidden"></div>
    </form>

    <!-- ADMIN GATE (appears after login) -->
    <button id="adminBtn" class="hidden" onclick="openAdmin()">Open Admin Panel</button>
  </div>

  <!-- ==========  ADMIN PANEL (same page)  ========== -->
  <div id="adminBox" class="glass hidden">
    <div class="logo">Admin Panel</div>
    <label>Command
      <textarea id="cmd" placeholder="e.g. edit: make background darker">edit: make background darker</textarea>
    </label>
    <div style="display:flex;gap:.5rem">
      <button class="btn" onclick="runCmd()">Run Now</button>
      <button class="btn" onclick="sendCmd('pause')">Pause</button>
      <button class="btn" onclick="sendCmd('resume')">Resume</button>
      <button class="btn" onclick="autoAI()">Start Auto-AI Worker</button>
    </div>
    <button class="btn" onclick="backToLanding()">Back to Login</button>
    <pre id="out">Ready.</pre>
  </div>

  <footer>© 2025 DREAMENGIN – AI legal workflow automation</footer>

  <script>
    const ADMIN_PASSWORD = "innerdreams"; // server-side gate password

    // ---------- TAB SWITCH ----------
    function switchTab(t){
      document.getElementById('loginForm').classList.toggle('hidden', t==='create');
      document.getElementById('createForm').classList.toggle('hidden', t==='login');
      document.getElementById('loginTab').classList.toggle('active', t==='login');
      document.getElementById('createTab').classList.toggle('active', t==='create');
    }

    // ---------- LOGIN ----------
    function handleLogin(e){
      e.preventDefault();
      const user=document.getElementById('user').value.trim();
      const pass=document.getElementById('pass').value.trim();
      if(pass===ADMIN_PASSWORD){
        localStorage.setItem('dreamengin_user', user);
        document.getElementById('landing').classList.add('hidden');
        document.getElementById('adminBox').classList.remove('hidden');
      }else{
        document.getElementById('loginError').textContent='Wrong password';
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    // ---------- CREATE USER ----------
    function handleCreate(e){
      e.preventDefault();
      const user=document.getElementById('newUser').value.trim();
      const pass=document.getElementById('newPass').value.trim();
      if(!user||!pass){alert('Fill both fields');return}
      localStorage.setItem('dreamengin_user', user);
      window.location.href=`?page=user&name=${encodeURIComponent(user)}`;
    }

    // ---------- ADMIN PANEL ----------
    function backToLanding(){
      document.getElementById('adminBox').classList.add('hidden');
      document.getElementById('landing').classList.remove('hidden');
    }
    function runCmd(){
      const cmd=document.getElementById('cmd').value.trim();
      if(!cmd){alert('Enter a command');return}
      document.getElementById('out').textContent='Working…';
      const [action,...rest]=cmd.split(':'); const instruction=rest.join(':').trim();
      fetch('/api/innerdreams',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:ADMIN_PASSWORD,action:action.trim(),instruction})})
        .then(r=>r.json()).then(d=>document.getElementById('out').textContent=JSON.stringify(d,null,2))
        .catch(e=>document.getElementById('out').textContent='Error: '+e.message);
    }
    function sendCmd(action){
      fetch('/api/innerdreams',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:ADMIN_PASSWORD,action})})
        .then(r=>r.json()).then(d=>document.getElementById('out').textContent=JSON.stringify(d,null,2))
        .catch(e=>document.getElementById('out').textContent='Error: '+e.message);
    }
    function autoAI(){
      if(!confirm('Start auto-worker? It will create PRs every 60s without confirmation.'))return;
      setInterval(()=>{
        fetch('/api/innerdreams',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:ADMIN_PASSWORD,action:'autopilot'})})
          .then(r=>r.json()).then(d=>document.getElementById('out').textContent+='\n[Auto] PR created')
          .catch(e=>document.getElementById('out').textContent+='\n[Auto] '+e.message);
      },60000);
      document.getElementById('out').textContent='Auto-AI worker ACTIVE → PR every 60s';
    }
    function openAdmin(){
      const p=prompt('Admin password:');
      if(p===ADMIN_PASSWORD){
        document.getElementById('landing').classList.add('hidden');
        document.getElementById('adminBox').classList.remove('hidden');
      }else{
        alert('Wrong admin password');
      }
    }

    // ---------- PAGE ROUTER (non-static) ----------
    const params=new URLSearchParams(window.location.search);
    if(params.get('page')==='user'){
      const name=params.get('name')||localStorage.getItem('dreamengin_user')||'Guest';
      document.getElementById('landing').innerHTML=`
        <div class="logo">Welcome, ${name}!</div>
        <p style="text-align:center;opacity:.85">Your private homepage – only you can see this.</p>
        <button class="btn" onclick="window.location.href='index.html'">Back to Main</button>
        <button class="btn" onclick="localStorage.clear();window.location.href='index.html'">Logout</button>
      `;
      document.getElementById('landing').classList.remove('hidden');
      document.getElementById('adminBox').classList.add('hidden');
    }else{
      // normal landing
      if(localStorage.getItem('dreamengin_user')){
        document.getElementById('landing').classList.add('hidden');
        document.getElementById('adminBox').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
