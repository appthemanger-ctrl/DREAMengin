<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DREAMENGIN – Create Admin Password</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="dreamengin.png" />
</head>
<body>
  <main class="glass">
    <img src="dreamengin.png" alt="DREAMENGIN" style="width:70px;margin:0 auto 1rem;display:block;" />
    <div class="logo">Admin Setup</div>
    <p style="text-align:center;opacity:.85;margin-bottom:1.5rem">Choose your admin password (stored server-side).</p>
    <label>Create admin password
      <input id="newAdminPw" type="password" placeholder="min 8 characters" />
    </label>
    <label>Repeat password
      <input id="repeatAdminPw" type="password" placeholder="repeat" />
    </label>
    <button onclick="setAdmin()">Create & Enter Admin</button>
    <div id="err" class="error hidden"></div>
  </main>
  <footer>© 2025 DREAMENGIN – AI legal workflow automation</footer>
  <script>
    async function setAdmin(){
      const p1 = document.getElementById('newAdminPw').value.trim();
      const p2 = document.getElementById('repeatAdminPw').value.trim();
      if(p1.length<8){document.getElementById('err').textContent='Min 8 characters';document.getElementById('err').classList.remove('hidden');return}
      if(p1!==p2){document.getElementById('err').textContent='Passwords do not match';document.getElementById('err').classList.remove('hidden');return}
      // store in KV (server-side) – endpoint provided below
      await fetch('/api/innerdreams',{
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({action:'setAdminPassword',password:p1})
      });
      alert('Admin password created – redirecting to panel');
      window.location.href='innerdreams-admin.html';
    }
  </script>
</body>
</html>
