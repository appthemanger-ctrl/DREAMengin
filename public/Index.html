<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DREAMENGIN – Legal Work Platform</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="dreamengin.png" />
</head>
<body>
  <main class="glass">
    <img src="dreamengin.png" alt="DREAMENGIN" style="width:80px;margin:0 auto 1rem;display:block;" />
    <div class="logo">DREAMENGIN</div>
    <p style="text-align:center;opacity:.85;margin-bottom:1.5rem">AI-assisted legal drafting, compliance checks, and auto-PR updates.</p>

    <!-- LOGIN -->
    <form id="loginForm">
      <label>Username
        <input id="user" type="text" placeholder="your name" required />
      </label>
      <label>Password
        <input id="pass" type="password" placeholder="password" required />
      </label>
      <button type="submit">Login</button>
      <div id="loginError" class="error hidden"></div>
    </form>

    <!-- CREATE ACCOUNT -->
    <div style="text-align:center;margin:1.5rem 0;font-size:.8rem;opacity:.7">or</div>
    <label>Create username
      <input id="newUser" placeholder="new name" />
    </label>
    <label>Create password
      <input id="newPass" type="password" placeholder="new password" />
    </label>
    <button onclick="createUser()">Create & Go</button>

    <!-- ADMIN BUTTON (appears after login) -->
    <button id="adminBtn" class="hidden" onclick="openAdmin()">Open Admin Panel</button>
  </main>

  <footer>© 2025 DREAMENGIN – AI-powered legal workflow automation</footer>

  <script>
    const ADMIN_GATE = "innerdreams"; // server-side gate password

    // ---------- LOGIN ----------
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const user = document.getElementById('user').value.trim();
      const pass = document.getElementById('pass').value.trim();
      if (pass === ADMIN_GATE) {
        localStorage.setItem('dreamengin_user', user);
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('adminBtn').classList.remove('hidden');
      } else {
        document.getElementById('loginError').textContent = 'Wrong password';
        document.getElementById('loginError').classList.remove('hidden');
      }
    });

    // ---------- CREATE USER ----------
    function createUser() {
      const user = document.getElementById('newUser').value.trim();
      const pass = document.getElementById('newPass').value.trim();
      if (!user || !pass) return alert('Fill both fields');
      localStorage.setItem('dreamengin_user', user);
      window.location.href = `user.html?name=${encodeURIComponent(user)}`;
    }

    // ---------- ADMIN GATE ----------
    function openAdmin() {
      const p = prompt('Admin password:');
      if (p === ADMIN_GATE) window.location.href = 'admin.html';
      else alert('Wrong admin password');
    }

    // auto-show admin button if already logged in
    if (localStorage.getItem('dreamengin_user')) {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('adminBtn').classList.remove('hidden');
    }
  </script>
</body>
</html>
