version: '3.8'

services:
  # ==========================================
  # Next.js Application
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dreamengin-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dreamengin
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - db
      - redis
      - minio
    networks:
      - dreamengin-net
    restart: unless-stopped

  # ==========================================
  # PostgreSQL Database (Supabase alternative for local dev)
  # ==========================================
  db:
    image: postgres:15-bookworm
    container_name: dreamengin-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dreamengin
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - dreamengin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis (Caching & Real-time Features)
  # ==========================================
  redis:
    image: redis:7-bookworm
    container_name: dreamengin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dreamengin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MinIO (S3-compatible storage for avatars/covers)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: dreamengin-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - dreamengin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==========================================
  # MinIO Client (Auto-create buckets)
  # ==========================================
  minio-init:
    image: minio/mc:latest
    container_name: dreamengin-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/avatars --ignore-existing;
      mc mb myminio/covers --ignore-existing;
      mc mb myminio/experiment-data --ignore-existing;
      mc anonymous set download myminio/avatars;
      mc anonymous set download myminio/covers;
      exit 0;
      "
    networks:
      - dreamengin-net

  # ==========================================
  # Nginx (Reverse Proxy)
  # ==========================================
  nginx:
    image: nginx:stable
    container_name: dreamengin-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - dreamengin-net
    restart: unless-stopped

  # ==========================================
  # Prometheus (Metrics Collection)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: dreamengin-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - dreamengin-net
    restart: unless-stopped

  # ==========================================
  # Grafana (Metrics Visualization)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: dreamengin-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - dreamengin-net
    restart: unless-stopped

  # ==========================================
  # Mailhog (Email Testing)
  # ==========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: dreamengin-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - dreamengin-net
    restart: unless-stopped

  # ==========================================
  # Adminer (Database Management UI)
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: dreamengin-adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
    networks:
      - dreamengin-net
    restart: unless-stopped

networks:
  dreamengin-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
