<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DREAMENGIN</title>
  <style>
    :root {
      --bg: #0b0b10;
      --glass: rgba(255, 255, 255, 0.05);
      --accent: #00f2ff;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: #eaeaf2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #1e1e3f, var(--bg));
    }
    .logo {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px var(--accent), 0 0 20px var(--purple); }
      to { text-shadow: 0 0 20px var(--accent), 0 0 40px var(--purple); }
    }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .btn {
      background: linear-gradient(90deg, var(--accent), var(--purple));
      border: none;
      color: #000;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      margin-top: 0.5rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    #out {
      margin-top: 1rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="glass">
    <div class="logo">DREAMENGIN</div>
    <p>Admin panel — no secrets, no dependencies, just paste and run.</p>

    <label>Admin password
      <input id="pw" type="password" placeholder="Enter password" />
    </label>

    <label>Command
      <textarea id="cmd" placeholder="e.g. ask: how do I improve SEO?">ask: how do I improve SEO?</textarea>
    </label>

    <button class="btn" onclick="run()">Run</button>
    <button class="btn" onclick="pause()">Pause</button>
    <button class="btn" onclick="resume()">Resume</button>

    <pre id="out">Ready.</pre>
  </div>

  <script>
    const out = document.getElementById('out');
    function log(x) { out.textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2); }

    async function run() {
      const pw = document.getElementById('pw').value.trim();
      const cmd = document.getElementById('cmd').value.trim();
      if (!pw || !cmd) return log('Missing password or command.');
      log('Working…');
      try {
        const [action, ...rest] = cmd.split(':');
        const instruction = rest.join(':').trim();
        const res = await fetch('/api/innerdreams', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: pw, action: action.trim(), instruction })
        });
        const data = await res.json();
        log(data);
      } catch (e) {
        log('Error: ' + e.message);
      }
    }

    async function pause() {
      await sendCmd('pause');
    }

    async function resume() {
      await sendCmd('resume');
    }

    async function sendCmd(action) {
      const pw = document.getElementById('pw').value.trim();
      if (!pw) return log('Missing password.');
      try {
        const res = await fetch('/api/innerdreams', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: pw, action })
        });
        const data = await res.json();
        log(data);
      } catch (e) {
        log('Error: ' + e.message);
      }
    }
  </script>
</body>
</html>
