# grafana/dashboards/default.yml
#
# Dashboard provisioning config. Tells Grafana to look for JSON dashboards
# in the /etc/grafana/provisioning/dashboards/ directory.

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
