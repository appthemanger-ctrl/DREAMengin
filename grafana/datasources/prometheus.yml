# grafana/datasources/prometheus.yml
#
# Auto-provision Prometheus as the default datasource in Grafana.
# Grafana reads this file on startup from its provisioning directory
# (mapped via docker-compose volume).

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
