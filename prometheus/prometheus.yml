# prometheus/prometheus.yml
#
# Prometheus scrape configuration for DREAMengin.
# Mounts into the prom/prometheus container via docker-compose.yml volume.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── DREAMengin Next.js app ──────────────────────────────────────────────────
  - job_name: 'dreamengin'
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'dreamengin'
          environment: 'development'
