name: Resilient Engine
description: Fixed-engine composite action that runs a command with retries and fails on real errors.

inputs:
  ruleset:
    description: Optional ruleset path. When provided, uses top-level `command:` from the file.
    required: false
    default: ''
  command:
    description: Shell command to run.
    required: false
    default: 'echo "resilient-engine: no command provided"'
  working-directory:
    description: Working directory for command execution.
    required: false
    default: '.'
  timeout-minutes:
    description: Timeout per attempt in minutes.
    required: false
    default: '20'
  retry-attempts:
    description: Number of attempts before failing.
    required: false
    default: '3'
  retry-backoff-seconds:
    description: Seconds to wait between retries.
    required: false
    default: '5'

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve command
      id: resolve-command
      shell: bash
      run: |
        set -euo pipefail

        COMMAND='${{ inputs.command }}'
        RULESET='${{ inputs.ruleset }}'

        if [ -n "$RULESET" ]; then
          if [ ! -f "$RULESET" ]; then
            echo "::error::Ruleset file not found: $RULESET"
            exit 1
          fi

          RULESET_COMMAND="$(python - "$RULESET" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          command = ""
          with open(path, encoding="utf-8") as handle:
              for raw in handle:
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  match = re.match(r"^command\s*:\s*(.+)$", line)
                  if match:
                      value = match.group(1).strip()
                      if (value.startswith('"') and value.endswith('"')) or (value.startswith("'") and value.endswith("'")):
                          value = value[1:-1]
                      command = value
                      break

          print(command)
          PY
          )"

          if [ -z "$RULESET_COMMAND" ]; then
            echo "::error::Ruleset '$RULESET' does not define a top-level command:"
            echo "::error::  command: <shell command>"
            exit 1
          fi

          COMMAND="$RULESET_COMMAND"
        fi

        {
          echo "command<<__RESILIENT_ENGINE_COMMAND__"
          echo "$COMMAND"
          echo "__RESILIENT_ENGINE_COMMAND__"
        } >> "$GITHUB_OUTPUT"

    - name: Run command with retry and hard failure
      shell: bash
      run: |
        set -euo pipefail

        COMMAND='${{ steps.resolve-command.outputs.command }}'
        WORKING_DIR='${{ inputs.working-directory }}'
        ATTEMPTS='${{ inputs.retry-attempts }}'
        BACKOFF='${{ inputs.retry-backoff-seconds }}'
        TIMEOUT='${{ inputs.timeout-minutes }}'

        if [ ! -d "$WORKING_DIR" ]; then
          echo "::error::Working directory not found: $WORKING_DIR"
          exit 1
        fi

        if ! [[ "$ATTEMPTS" =~ ^[0-9]+$ ]] || [ "$ATTEMPTS" -lt 1 ]; then
          echo "::error::retry-attempts must be an integer >= 1"
          exit 1
        fi

        if ! [[ "$BACKOFF" =~ ^[0-9]+$ ]]; then
          echo "::error::retry-backoff-seconds must be an integer >= 0"
          exit 1
        fi

        if ! [[ "$TIMEOUT" =~ ^[0-9]+$ ]] || [ "$TIMEOUT" -lt 1 ]; then
          echo "::error::timeout-minutes must be an integer >= 1"
          exit 1
        fi

        STATUS=0

        for ATTEMPT in $(seq 1 "$ATTEMPTS"); do
          echo "🚀 resilient-engine attempt ${ATTEMPT}/${ATTEMPTS}"

          if timeout "${TIMEOUT}m" bash -lc "cd \"$WORKING_DIR\" && $COMMAND"; then
            echo "✅ resilient-engine succeeded on attempt ${ATTEMPT}/${ATTEMPTS}"
            exit 0
          else
            STATUS=$?
            echo "⚠️ resilient-engine attempt ${ATTEMPT}/${ATTEMPTS} failed with exit code ${STATUS}"
          fi

          if [ "$ATTEMPT" -lt "$ATTEMPTS" ] && [ "$BACKOFF" -gt 0 ]; then
            echo "⏳ waiting ${BACKOFF}s before retry"
            sleep "$BACKOFF"
          fi
        done

        echo "::error::resilient-engine failed after ${ATTEMPTS} attempts (exit ${STATUS})"
        exit "$STATUS"
