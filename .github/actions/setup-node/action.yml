name: Setup Node 24
description: Standard Node 24 runtime for DREAMengin workflows

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.30.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
