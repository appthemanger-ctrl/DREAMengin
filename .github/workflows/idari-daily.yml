name: Idari Daily Improvement Cycle

# ──────────────────────────────────────────────────────────────────────────────
# Idari runs twice per week — Monday and Thursday at midnight UTC.
# Contract: docs/IDARI_CONTRACT.md
#
# Sequence (mirrors portfolio-optimizer two-job pattern):
#   JOB 1 — spec-check  (like portfolio-optimizer "build"):
#     Verify spec requirements and architecture alignment BEFORE any changes.
#     Reads REPO_COMPANION.md + FEATURE_STATUS.md, runs tripwires, checks for drift.
#     If this job fails, idari-cycle is skipped entirely.
#
#   JOB 2 — idari-cycle  (existing improvement cycle):
#     Runs only after spec-check passes (needs: spec-check).
#     1. Read all files in /docs
#     2. Analyse repository state
#     3. Verify architecture alignment
#     4. Run improvement agents (battery, scene, UI, Supabase)
#     5. Commit and push any approved changes directly to completedream.
#        Vercel auto-deploys on push to completedream.
#
#   JOB 3 — vercel-build-verify  (like portfolio-optimizer "optimize"):
#     Runs only after idari-cycle (needs: idari-cycle).
#     Checks out completedream and runs `next build` against the 2026
#     Vercel-compatible runtime:
#       Node 25 · pnpm 10.30.0 · Next.js 16+  (docs/ARCHITECTURE.md §10)
#     Ensures every change Idari commits still compiles.
#
# Idari may NOT modify /docs or any governance / policy files.
# Push is aborted if no architecture-justified changes are found.
# ──────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 0 * * 1,4'   # twice weekly — Monday and Thursday 00:00 UTC

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual'
      dry_run:
        description: 'Dry run — analyse only, no commit'
        type: boolean
        default: false
permissions:
  contents: write        # needed to push directly to completedream
concurrency:
  group: idari-daily
  cancel-in-progress: false   # never cancel a running cycle; queue instead

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/idari-daily.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
