name: Deploy to Vercel (Manual)

# ──────────────────────────────────────────────────────────────────────────────
# Manual-only emergency deployer.  Normal production deployments are handled
# by the Vercel GitHub integration — Vercel watches the `completedream` branch
# and auto-deploys on every push, so no VERCEL_TOKEN or CLI steps are needed
# in the regular CI pipeline.
#
# Use this workflow only when you need to force a deployment outside the normal
# GitHub → Vercel integration flow (e.g. to redeploy without a new commit).
#
# Inputs (all optional, for traceability):
#   caller    — name of the calling workflow
#   reason    — human-readable deploy reason
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      caller:
        description: "Name of the calling workflow"
        type: string
        default: "manual"
      reason:
        description: "Reason for this deployment"
        type: string
        default: "manual emergency deploy"
  workflow_call:
    inputs:
      caller:
        description: "Name of the calling workflow"
        type: string
        default: "unknown"
      reason:
        description: "Reason for this deployment"
        type: string
        default: "push to main"
    secrets:
      VERCEL_TOKEN:
        required: true
      NEXT_PUBLIC_SUPABASE_URL:
        required: false
      NEXT_PUBLIC_SUPABASE_ANON_KEY:
        required: false

# Allow only one Vercel deploy to run at a time.
# Additional calls queue up and run in order rather than being cancelled.
permissions:
  contents: read
concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (called by ${{ inputs.caller }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/vercel-deploy.yml
          allow-failure: 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
