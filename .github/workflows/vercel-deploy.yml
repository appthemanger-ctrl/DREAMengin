name: Deploy to Vercel

# ──────────────────────────────────────────────────────────────────────────────
# Single reusable deployer — all other workflows CALL this instead of running
# their own Vercel build.  This ensures exactly one Vercel build fires per
# qualifying event.
#
# Callers:
#   github-actions.yml  (main CI/CD pipeline)
#
# Inputs (all optional, for traceability):
#   caller    — name of the calling workflow
#   reason    — human-readable deploy reason
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      caller:
        description: "Name of the calling workflow"
        type: string
        default: "unknown"
      reason:
        description: "Reason for this deployment"
        type: string
        default: "push to main"
    secrets:
      VERCEL_TOKEN:
        required: true
      NEXT_PUBLIC_SUPABASE_URL:
        required: false
      NEXT_PUBLIC_SUPABASE_ANON_KEY:
        required: false

# Allow only one Vercel deploy to run at a time.
# Additional calls queue up and run in order rather than being cancelled.
concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel (called by ${{ inputs.caller }})
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dreamengin.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: pnpm dlx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy prebuilt artifacts
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Vercel Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Caller | ${{ inputs.caller }} |"
            echo "| Reason | ${{ inputs.reason }} |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
