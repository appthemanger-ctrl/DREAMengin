name: Overwrite from Zip

on:
  workflow_dispatch:

jobs:
  overwrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip
        run: |
          rm -rf /tmp/new
          mkdir /tmp/new
          unzip -q incoming/latest.zip -d /tmp/new

      - name: Replace repo
        run: |
          # Keep .git and incoming/
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "incoming" \
            -exec rm -rf {} +

          # Copy new files in
          cp -a /tmp/new/* .

      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com

          git add .
          git commit -m "Update from latest.zip" || exit 0
          git push
