name: gameengin-maestro

# Maestro orchestrator. Spec: GameENGINspec.md §3.1.
# Twice daily + manual dispatch. Dispatches sub-agents based on telemetry.

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      target_cartridge:
        description: 'Cartridge id to analyze'
        required: false
        default: 'mad-maxi'

permissions:
  contents: write
  actions: write

concurrency:
  group: gameengin-maestro-${{ github.event.inputs.target_cartridge || 'mad-maxi' }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_CARTRIDGE: ${{ github.event.inputs.target_cartridge || 'mad-maxi' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_ACTIONS_DISPATCH: '1'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.0 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run Maestro analyze
        run: pnpm tsx scripts/gameengin/maestro-analyze.ts
      - name: Upload insights artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-insights-${{ env.TARGET_CARTRIDGE }}
          path: |
            .gameengin-maestro-insights.json
            lib/gameengin/brain/rd-sessions/*.json
