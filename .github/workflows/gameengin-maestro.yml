name: gameengin-maestro

# Maestro orchestrator. Spec: GameENGINspec.md §3.1.
# Twice daily + manual dispatch. Dispatches sub-agents based on telemetry.
on:
  workflow_dispatch:
    inputs:
      target_cartridge:
        description: 'Cartridge id to analyze'
        required: false
        default: 'mad-maxi'
permissions:
  contents: write
  actions: write
concurrency:
  group: gameengin-maestro-${{ github.event.inputs.target_cartridge || 'mad-maxi' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/gameengin-maestro.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
