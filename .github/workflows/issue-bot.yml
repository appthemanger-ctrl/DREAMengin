name: 🤖 Issue Fix Bot — Consolidated PR

# ──────────────────────────────────────────────────────────────────────────────
# DREAMengin Unified Issue-Fix Bot
#
# Reads up to 30 open GitHub issues, classifies each one, applies every
# automated repair available to this codebase (ESLint --fix, TypeScript audit,
# per-issue triage docs, feature spec stubs, and a running ISSUE_FIXES tracker),
# commits everything to a fresh timestamped branch, and opens ONE consolidated
# pull request that:
#
#   • Lists every addressed issue with category + fix summary
#   • Emits "Closes #N" for each issue so GitHub auto-closes them on merge
#   • Posts a friendly bot comment on every issue it touched
#
# Triggers:
#   workflow_dispatch  — manual run with tunable inputs
#   schedule           — every Monday at 06:00 UTC
#
# Required secrets:
#   GITHUB_TOKEN / GH_TOKEN  — standard Actions token (contents + issues + PRs)
#
# Optional secrets (passed to typecheck / build if needed):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      max_issues:
        description: >
          Maximum number of open issues to process (1–30).
          All open issues are fetched when no label filter is set.
        required: false
        default: '30'
        type: string

      base_branch:
        description: >
          Target branch the consolidated PR will be opened against.
        required: false
        default: 'completedream'
        type: string

      dry_run:
        description: >
          Dry run — triage + auto-fix + commit, but skip push and PR creation.
          Useful for previewing what the bot would do without publishing anything.
        required: false
        default: false
        type: boolean

      labels_filter:
        description: >
          Comma-separated label names to restrict which issues are processed
          (OR logic — an issue matching ANY of these labels is included).
          Leave blank to process all open issues regardless of labels.
        required: false
        default: ''
        type: string

      close_after_merge:
        description: >
          When true (default), the PR body includes "Closes #N" keywords so
          GitHub auto-closes each addressed issue when the PR is merged.
          Set to false to create a tracking-only PR that does not close issues.
        required: false
        default: true
        type: boolean

  schedule:
    # Every Monday at 06:00 UTC — weekly automated sweep of all open issues.
    - cron: '0 6 * * 1'

# ─────────────────────────────────────────────────────────────────────────────
# Permissions
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write       # checkout, push bot branch, commit triage docs
  issues: write         # post comments on addressed issues
  pull-requests: write  # create the consolidated PR

# ─────────────────────────────────────────────────────────────────────────────
# Concurrency — allow at most one bot run at a time; never cancel in progress
# so a partial run doesn't leave orphaned branches.
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: issue-fix-bot
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# Shared environment
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/issue-bot.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
