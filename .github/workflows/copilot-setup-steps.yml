name: "Copilot Setup Steps"

# Run automatically when this file changes (for validation) and allow
# manual runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # MUST be named exactly `copilot-setup-steps` to be picked up by the
  # GitHub Copilot cloud agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── pnpm ────────────────────────────────────────────────────────────────
      # Must match packageManager field in package.json (pnpm@10.33.0)
      - name: Setup pnpm 10.33.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # ── Node 25 ─────────────────────────────────────────────────────────────
      - name: Setup Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ── Install dependencies ─────────────────────────────────────────────────
      # --frozen-lockfile ensures the lockfile is never mutated during setup.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
