name: DREAMengin Final Product Definition — Automated Checks

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamengin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dreamengin-100point-gates:
    name: 100-Point “Done” Gates (automated subset)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (Next.js)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      # ---- Security / supply-chain (maps to: keys server-side, safe defaults, destructive actions guarded) ----
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerability audit (npm)
        run: npm audit --audit-level=high

      # ---- Code health (maps to: consistent behavior, no dead UI due to errors, predictable restore) ----
      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      # ---- Build gate (maps to: routes exist, app router compiles, premium surfaces don’t crash) ----
      - name: Build (Next.js)
        run: npm run build

      # ---- Route existence checks (maps to points: daydream routes, marketplace, shop, settings/feed, public profile) ----
      - name: Verify required App Router pages exist
        shell: bash
        run: |
          set -euo pipefail

          # Required routes from your spec (minimum shells are fine)
          REQUIRED_FILES=(
            "app/marketplace/page.tsx"
            "app/shop/page.tsx"
            "app/settings/feed/page.tsx"
            "app/u/[handle]/page.tsx"
          )

          missing=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing required route file: $f"
              missing=1
            fi
          done

          # Daydreams: exactly six specialized daydreams exist as routes
          # Convention assumed: app/daydreams/<slug>/page.tsx (adjust if you use a different folder)
          if [[ -d "app/daydreams" ]]; then
            count="$(find app/daydreams -mindepth 2 -maxdepth 2 -type f -name 'page.tsx' | wc -l | tr -d ' ')"
            if [[ "$count" -ne 6 ]]; then
              echo "::error::Expected exactly 6 Daydream routes under app/daydreams/*/page.tsx, found $count"
              echo "Found:"
              find app/daydreams -mindepth 2 -maxdepth 2 -type f -name 'page.tsx' -print || true
              exit 1
            fi
          else
            echo "::error::Missing app/daydreams directory. Expected daydream routes at app/daydreams/*/page.tsx"
            exit 1
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      # ---- API route existence checks (maps to: AI triad endpoints, server-side keys) ----
      - name: Verify required AI API routes exist
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_API=(
            "app/api/ai/eams/route.ts"
            "app/api/ai/idari/route.ts"
            "app/api/ai/boogieman/route.ts"
          )

          for f in "${REQUIRED_API[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing required API route: $f"
              exit 1
            fi
          done

      # ---- “Keys must be server-side only” heuristic scan (best-effort) ----
      # Not perfect, but catches the obvious footguns: client-side key literals.
      - name: Heuristic: forbid API keys in client bundles
        shell: bash
        run: |
          set -euo pipefail

          # Scan common client-side directories for suspicious key usage.
          # Adjust directories if your structure differs.
          TARGETS=( "app" "src" "components" )

          # Patterns: OpenAI keys, generic API key assignments, Supabase service role keys, etc.
          PATTERN='(sk-[A-Za-z0-9]{10,}|SUPABASE_SERVICE_ROLE|SERVICE_ROLE_KEY|OPENAI_API_KEY\s*=\s*["'\'']|apiKey\s*:\s*["'\''])'

          found=0
          for dir in "${TARGETS[@]}"; do
            if [[ -d "$dir" ]]; then
              # Ignore server-only folders by convention
              # (still best-effort; update ignores as your repo evolves)
              hits="$(rg -n --hidden --no-ignore-vcs -S "$PATTERN" "$dir" \
                -g'!**/app/api/**' \
                -g'!**/*.test.*' \
                -g'!**/__tests__/**' \
                -g'!**/node_modules/**' || true)"
              if [[ -n "$hits" ]]; then
                echo "::error::Suspicious key-like material found outside server routes:"
                echo "$hits"
                found=1
              fi
            fi
          done

          if [[ "$found" -ne 0 ]]; then
            echo "Move secrets to server-only code (app/api/**) and use environment variables."
            exit 1
          fi

      # ---- Optional: unit/integration tests if present ----
      - name: Test (if present)
        run: npm test --if-present
