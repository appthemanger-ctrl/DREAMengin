name: Elite GameEngin Evolution 🚀

# DREAMengin Elite GameEngin Runtime — 2026
#
# The most comprehensive GameEngin runtime CI pipeline in the repo.
# Combines: WebGPU validation, AI-powered analysis, performance
# regression detection, game quality scoring, and automated
# improvement proposals.
#
# Triggers:
#   - Push to components/games/, lib/gameengin/, components/gameengin/
#   - Manual workflow dispatch (with optional AI directive)
#   - Weekly on Monday at 06:00 UTC
on:
  workflow_dispatch:
    inputs:
      directive:
        description: 'AI directive for this run (optional — e.g. "improve NeonDrift boss AI")'
        required: false
        default: ''
        type: string
      game_target:
        description: 'Target game ID from advanced-game-targets.json (optional)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: elite-gameengin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/elite-gameengin-evolution.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
