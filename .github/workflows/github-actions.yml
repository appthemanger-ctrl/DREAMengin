name: DREAMengin CI/CD Pipeline

on:
  workflow_dispatch:

# Prevent parallel pipeline runs on the same ref.
# Vercel deployments are handled by the Vercel GitHub integration — no deploy job needed here.
concurrency:
  group: ci-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '25'
  PNPM_VERSION: '10.30.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ==========================================
  # Code Quality & Linting
  # ==========================================
  quality:
    name: Advisory Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        continue-on-error: true
        run: pnpm run typecheck

      - name: Lint
        continue-on-error: true
        run: pnpm run lint

  # ==========================================
  # Build & Test
  # ==========================================
  verify:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Build Next.js
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 1

  # ==========================================
  # Database Migration Check
  # ==========================================
  database:
    name: Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check migration files
        shell: bash
        run: |
          echo "Checking SQL migration files..."
          if [ ! -d supabase/migrations ]; then
            echo "supabase/migrations is missing"
            exit 1
          fi
          mapfile -t migrations < <(find supabase/migrations -name "*.sql" -type f | sort)
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "No SQL migration files found."
            exit 1
          fi
          printf '%s\n' "${migrations[@]}"
          echo "Migration files validated!"

  # ==========================================
  # Security Scanning
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================
  # Docker Build & Push
  # ==========================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ==========================================
  # Deploy to Vercel (Production)
  # ──────────────────────────────────────────
  # Vercel deployments are handled automatically by the Vercel GitHub
  # integration — no VERCEL_TOKEN or CLI steps needed here.
  # Pushing to the `completedream` branch is sufficient; Vercel watches
  # that branch and triggers a production deployment on every push.
  # ==========================================

  # ==========================================
  # Deploy to Kubernetes (Optional)
  # ==========================================
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false  # Disabled by default
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl rollout status deployment/dreamengin-app -n dreamengin

  # ==========================================
  # Smoke Tests (Post-Deploy)
  # ==========================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/completedream')
    steps:
      - name: Wait for deployment
        run: sleep 45

      - name: Check public API
        run: |
          curl -fsS https://dreamengin.com/api/dreamengin/os-status
          echo "Public API check passed!"

      - name: Check homepage
        run: |
          curl -fsS https://dreamengin.com > /dev/null
          echo "Homepage accessible!"

  # ==========================================
  # Build Memory Drift Check
  # (was check-build-memory-drift.yml)
  # ==========================================
  drift-check:
    name: Build Memory Drift
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Check build-memory for drift
        run: node scripts/check-build-memory-drift.mjs

      - name: Instructions on failure
        if: failure()
        run: |
          echo ""
          echo "────────────────────────────────────────────────────────"
          echo "  Build Memory Drift Detected"
          echo "────────────────────────────────────────────────────────"
          echo "  Fix: node scripts/sync-build-memory.mjs"
          echo "       git add build-memory/ && git commit -m 'chore: sync build-memory'"
          echo "────────────────────────────────────────────────────────"

  # ==========================================
  # Vercel Build Probe
  # (was vercel-build-probe.yml)
  # ==========================================
  build-probe:
    name: Vercel Build Probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vercel-equivalent build probe
        id: probe
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL:              ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY:         ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:  ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set +e
          mkdir -p .ci
          pnpm run vercel-build > .ci/vercel-build-probe.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          tail -n 100 .ci/vercel-build-probe.log
          exit 0

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build-probe-${{ github.run_number }}
          path: .ci/vercel-build-probe.log

      - name: Probe summary
        if: always()
        run: |
          echo "## Vercel Build Probe" >> "$GITHUB_STEP_SUMMARY"
          echo "| Exit code | \`${{ steps.probe.outputs.exit_code }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================
  # Notify on Failure
  # ==========================================
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [verify, smoke-tests, docker]
    if: failure()
    steps:
      - name: Send notification
        run: |
          echo "Deployment failed! Check logs."
          # Add Slack/Discord webhook here
