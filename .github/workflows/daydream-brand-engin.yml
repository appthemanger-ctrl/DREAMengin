name: Brand Daydream Lobby + BrandingEngin Runtime Health

# Builds, updates, checks, and auto-fixes the Brand Daydream lobby and BrandingEngin runtime.
# Covers: app/daydream/brand/, app/daydream/analytics/, app/edit-profiledream/,
#         components/daydream/BrandingEngin.tsx, app/analytics/
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'   # weekly Monday 05:00 UTC
permissions:
  contents: write
concurrency:
  group: daydream-brand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/daydream-brand-engin.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
