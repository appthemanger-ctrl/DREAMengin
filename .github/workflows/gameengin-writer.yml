name: gameengin-writer

# Writer narrative agent. Spec: GameENGINspec.md §3.5 / §5.4.

on:
  workflow_dispatch:
    inputs:
      target_cartridge: { description: 'Cartridge id', required: false, default: 'mad-maxi' }

permissions:
  contents: write
  pull-requests: write

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_CARTRIDGE: ${{ github.event.inputs.target_cartridge }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.0 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run Writer
        run: pnpm tsx scripts/gameengin/writer-run.ts
      - name: Upload writer output
        uses: actions/upload-artifact@v4
        with:
          name: writer-${{ github.event.inputs.target_cartridge }}
          path: |
            .gameengin-writer-output.json
            public/cartridges/${{ github.event.inputs.target_cartridge }}/story/beats.json
