name: Preflight (staging)

# ──────────────────────────────────────────────────────────────────────────────
# Runs on staging branches or manually. Performs architecture tripwires,
# placeholder scan, and writes a preflight report.
# Note: some tripwire scripts are generated lazily — steps that call them
# use continue-on-error: true and skip gracefully if the script is absent.
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preflight-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/preflight.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
