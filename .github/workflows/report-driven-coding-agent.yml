name: Report-Driven GitHub Coding Agent
on:
  workflow_dispatch:
    inputs:
      report_path:
        description: 'Path to a repo report (markdown/json) for the agent to act on'
        required: false
        default: 'docs/BUGS.md'
        type: string
      report_text:
        description: 'Optional free-form report text to use instead of report_path'
        required: false
        default: ''
        type: string
      commit_changes:
        description: 'Commit and push validated changes back to the current branch'
        required: false
        default: true
        type: boolean
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: report-driven-coding-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/report-driven-coding-agent.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
