name: gameengin-artisan

# Artisan visual asset agent. Spec: GameENGINspec.md §3.3.

on:
  workflow_dispatch:
    inputs:
      target_cartridge: { description: 'Cartridge id', required: false, default: 'mad-maxi' }

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_CARTRIDGE: ${{ github.event.inputs.target_cartridge }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run Artisan
        run: pnpm tsx scripts/gameengin/artisan-run.ts
      - name: Upload artisan output
        uses: actions/upload-artifact@v4
        with:
          name: artisan-${{ github.event.inputs.target_cartridge }}
          path: .gameengin-artisan-output.json
