name: DREAMengin Optimization
on:
  workflow_dispatch:
    inputs:
      optimization_target:
        description: 'Optimization target (feed, search, widgets, layout, assets, render, cache, notifications, offline, routing, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - feed
          - search
          - widgets
          - layout
          - assets
          - render
          - cache
          - notifications
          - offline
          - routing
  schedule:
    # Run weekly Monday at 3 AM UTC
    - cron: '0 3 * * 1'
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/optimize-dreamengin.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
