name: Bot PR — Approve, Resolve Conflicts & Auto-Merge

# Approves every PR opened by a known dependency/automation bot,
# resolves any merge conflicts by accepting the current base-branch
# version (--ours strategy), then enables auto-merge so the PR lands
# as soon as required status checks pass.
#
# Supported bots:
#   dependabot[bot], renovate[bot], github-actions[bot],
#   snyk-bot, whitesource-bolt-for-github[bot], deepsource-autofix[bot]
#
# Manual sweep: workflow_dispatch → leave pr_number blank to process
# every currently-open bot PR, or fill it in to target one PR.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: >
          PR number to process (leave blank to sweep all open bot PRs)
        required: false
        default: ''
permissions:
  contents: write
  pull-requests: write

# ─────────────────────────────────────────────────────────────────────────────
# Helpers used across steps
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: bot-automerge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/bot-pr-automerge.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
