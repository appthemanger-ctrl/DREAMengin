name: root-hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - completedream
      - develop

jobs:
  check-root-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check root hygiene
        run: node scripts/check-root-hygiene.mjs
