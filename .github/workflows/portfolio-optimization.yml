name: Optemizero

on:
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────────────────────
# Hardcoded DREAMengin Daydream → Engin mapping (canonical — do not edit)
# Source of truth: lib/identity/canonical-names.ts → DAYDREAM_TO_ENGIN
# Each of the 6 quantum optimizer outputs is assigned to one Daydream/Engin pair.
#
#   Daydream  │  Engin           │  Optimizer output
#   ──────────┼──────────────────┼───────────────────────
#   Music     │  StarMakerEngin  │  algorithm
#   Games     │  GameEngin       │  objective-value
#   Lab       │  LabEngin        │  backend
#   Code      │  CodeEngin       │  sharpe-ratio
#   Brand     │  BrandingEngin   │  expected-return-pct
#   Create    │  ContentEngin    │  portfolio-risk-pct
# ──────────────────────────────────────────────────────────────────────────────
env:
  DD_MUSIC_ENGIN: StarMakerEngin
  DD_GAMES_ENGIN: GameEngin
  DD_LAB_ENGIN: LabEngin
  DD_CODE_ENGIN: CodeEngin
  DD_BRAND_ENGIN: BrandingEngin
  DD_CREATE_ENGIN: ContentEngin

jobs:
  # ──────────────────────────────────────────────────────────────
  # Build: self-bootstrap the quantum portfolio optimizer from
  # source so the pipeline never relies on pre-cached layers.
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build optimizer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Clone quantum-portfolio-optimizer
        run: |
          git clone --depth=1 --branch v0.2.0 https://github.com/shymonski-dev/quantum-portfolio-optimizer.git /tmp/qpo

      - name: Install optimizer (all extras)
        run: |
          pip install -e "/tmp/qpo[all]"

      - name: Smoke-test CLI
        run: qpo --version

      - name: Run optimizer test suite
        run: |
          cd /tmp/qpo
          pytest --tb=short -q

  # ──────────────────────────────────────────────────────────────
  # Optimize: run the action-packaged optimizer against config.yaml
  # and map all six result outputs to their Daydream / Engin pair.
  # ──────────────────────────────────────────────────────────────
  optimize:
    name: Optimize portfolio
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run quantum portfolio optimizer
        id: optimizer
        uses: shymonski-dev/quantum-portfolio-optimizer@main
        with:
          config-path: config.yaml
          python-version: "3.11"

      - name: Print DREAMengin Daydream→Engin optimization summary
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  Optemizero — DREAMengin Daydream/Engin Results"
          echo "══════════════════════════════════════════════════"
          echo ""
          echo "  Music     │ ${{ env.DD_MUSIC_ENGIN }}  │ Algorithm:       ${{ steps.optimizer.outputs.algorithm }}"
          echo "  Games     │ ${{ env.DD_GAMES_ENGIN }}      │ Objective value: ${{ steps.optimizer.outputs.objective-value }}"
          echo "  Lab       │ ${{ env.DD_LAB_ENGIN }}      │ Backend:         ${{ steps.optimizer.outputs.backend }}"
          echo "  Code      │ ${{ env.DD_CODE_ENGIN }}      │ Sharpe ratio:    ${{ steps.optimizer.outputs.sharpe-ratio }}"
          echo "  Brand     │ ${{ env.DD_BRAND_ENGIN }}  │ Expected return: ${{ steps.optimizer.outputs.expected-return-pct }}%"
          echo "  Create    │ ${{ env.DD_CREATE_ENGIN }}   │ Portfolio risk:  ${{ steps.optimizer.outputs.portfolio-risk-pct }}%"
          echo ""
          echo "══════════════════════════════════════════════════"
