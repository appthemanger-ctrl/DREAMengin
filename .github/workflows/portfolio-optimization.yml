name: Portfolio Optimization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Build: install the DREAMengin optimization toolchain.
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build optimizer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke-test optimizer script
        run: |
          node scripts/optimize-dreamengin.mjs --help 2>&1 || true
          echo "Optimizer script present at scripts/optimize-dreamengin.mjs"
          echo "Config present at config/optimizer.yaml"

  # ──────────────────────────────────────────────────────────────
  # Optimize: run the optimizer against config/optimizer.yaml
  # and surface all result outputs.
  # ──────────────────────────────────────────────────────────────
  optimize:
    name: Optimize portfolio
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run optimizer
        id: optimizer
        run: |
          node scripts/optimize-dreamengin.mjs \
            --target=all \
            --config=config/optimizer.yaml \
            --output=.optimization-results.json

          node -e "
            const r = require('./.optimization-results.json');
            console.log('algorithm=' + r.algorithm);
            console.log('objective_value=' + r.objective_value);
            console.log('constraints_satisfied=' + r.constraints_satisfied);
            console.log('optimization_score=' + r.optimization_score);
          " >> \$GITHUB_OUTPUT

      - name: Print summary
        run: |
          {
            echo "## Portfolio Optimization"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Algorithm | ${{ steps.optimizer.outputs.algorithm }} |"
            echo "| Objective value | ${{ steps.optimizer.outputs.objective_value }} |"
            echo "| Constraints satisfied | ${{ steps.optimizer.outputs.constraints_satisfied }} |"
            echo "| Optimization score | ${{ steps.optimizer.outputs.optimization_score }}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Algorithm: ${{ steps.optimizer.outputs.algorithm }}"
          echo "Objective value: ${{ steps.optimizer.outputs.objective_value }}"
          echo "Constraints satisfied: ${{ steps.optimizer.outputs.constraints_satisfied }}"
          echo "Optimization score: ${{ steps.optimizer.outputs.optimization_score }}%"

