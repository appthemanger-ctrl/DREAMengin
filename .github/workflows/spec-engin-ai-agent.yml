name: Spec-Engin AI Agent

# ──────────────────────────────────────────────────────────────────────────────
# DREAMengin AI big-move loop
#
# Three-job pipeline:
#   1. scan    — snapshot docs + code into a large-context file
#   2. propose — GPT-4.1 designs ONE creative, SICC-aligned platform change
#   3. implement — GPT-4.1 writes the first slice as a git patch,
#                  applies it, then builds + tests to gate the commit
#
# SICC has TWO canon meanings (both enforced in prompts):
#   Super Immersive Creative Controls  (immersion)
#   Stylized · Intuitive · Cohesive · Coherent  (clarity)
#
# Required repository secret:  OPENAI_API_KEY
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: spec-engin-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/spec-engin-ai-agent.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
