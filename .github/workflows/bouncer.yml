name: Bouncer — Hard-Fix Guard

# Enforces the hard-block rules from docs/engineering/guardrails.md by
# automatically fixing violations instead of blocking:
# - Renames files whose basename contains "Engine" (but not "Engin"/"Dreamengin")
# - Replaces banned privacy/publish patterns with safe alternatives
# - Appends safe-projection markers to ViewProfile files using draft state unsafely
# Lint warnings and typecheck issues are NOT bounced — they are advisory.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bouncer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/bouncer.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
