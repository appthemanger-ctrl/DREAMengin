name: Bouncer — Hard-Fix Guard

# Enforces the hard-block rules from docs/engineering/guardrails.md by
# automatically fixing violations instead of blocking:
# - Renames files whose basename contains "Engine" (but not "Engin"/"Dreamengin")
# - Replaces banned privacy/publish patterns with safe alternatives
# - Appends safe-projection markers to ViewProfile files using draft state unsafely
# Lint warnings and typecheck issues are NOT bounced — they are advisory.

on:
  push:
    branches: [main, develop, completedream]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: bouncer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  hard-fix:
    name: Bouncer — Hard-Fix Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 25
        uses: ./.github/actions/setup-node

      - name: Run spec-check (auto-fix mode)
        run: node scripts/spec-check.cjs .

      - name: Commit and push fixes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(bouncer): auto-fix spec violations [skip ci] [skip vercel]"
            git push
            echo "Bouncer committed and pushed fixes."
          else
            echo "Bouncer passed — no violations found, nothing to fix."
          fi
