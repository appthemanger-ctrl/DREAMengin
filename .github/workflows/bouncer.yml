name: Repo Guard

on:
  pull_request:
  push:

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Block forbidden files
        run: |
          echo "🔒 Checking repo..."

          # Block node_modules
          if git ls-files | grep -q "node_modules"; then
            echo "❌ node_modules detected"
            exit 1
          fi

          # Block real env files (allow .env.example and next-env.d.ts)
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "❌ .env file detected"
            exit 1
          fi

          # Block large files (>5MB)
          files=$(git ls-files)
          for f in $files; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              if [ $size -gt 5242880 ]; then
                echo "❌ Large file: $f"
                exit 1
              fi
            fi
          done
