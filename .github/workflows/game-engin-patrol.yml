name: GameEngin Bug Patrol

# The 7th action — mimics GameEngin's control-layer role in CI.
# Scans all games code just as GameEngin scans player scores and game state.
#
# Covers every file that GameEngin manages at runtime:
#   - components/games/       — WordSprint, MemoryGrid, SpeedTap, GameRemote, Leaderboard
#   - components/daydream/GameEngin.tsx — the Engin runtime itself
#   - app/game/               — Dr. Eams Platformer (GamePageClient)
#   - app/daydream/games/     — Games Daydream (GamesHub)
#   - app/api/game-scores/    — score submission API
#
# Steps:
#   1. Checkout + install
#   2. Typecheck games scope
#   3. Lint games scope (report mode)
#   4. ESLint auto-fix games scope
#   5. Unit tests for games components
#   6. Scan for known game-bug patterns (unguarded setInterval, missing cleanup)
#   7. Commit + push any auto-fixes
#   8. Upload patrol report
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # weekly Monday 04:00 UTC
permissions:
  contents: write
concurrency:
  group: game-engin-patrol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/game-engin-patrol.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
