name: Mobile PS5 Spec Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 3'   # weekly Wednesday 08:00 UTC

permissions:
  contents: write

concurrency:
  group: mobile-ps5-spec-evolution
  cancel-in-progress: true

jobs:
  evolve-spec:
    name: Research web + evolve mobile PS5 spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Generate evolving mobile PS5 spec
        run: node scripts/generate-mobile-ps5-spec.mjs

      - name: Commit spec updates
        run: |
          if [ -n "$(git status --porcelain docs/mobile-ps5-web-gaming-engine-spec.md)" ]; then
            git config user.name "Mobile PS5 Spec Bot"
            git config user.email "253588904+appthemanager-ctrl@users.noreply.github.com"
            git add docs/mobile-ps5-web-gaming-engine-spec.md
            git commit -m "docs(spec): evolve mobile ps5-level web gaming engine spec [skip ci] [skip vercel]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No spec changes to commit."
          fi
