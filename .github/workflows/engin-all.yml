name: Engin Runtimes — All Health & Feature Patrols

# Combined replacement for the six individual engin-*.yml workflows:
#   engin-starmaker.yml · engin-game.yml · engin-lab.yml
#   engin-code.yml      · engin-content.yml · engin-branding.yml
#
# Runs all six Engin runtime health patrols as a single matrix workflow.
# One workflow entry in the Actions tab instead of six.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'   # weekly Monday 02:30 UTC
permissions:
  contents: write
concurrency:
  group: engin-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/engin-all.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
