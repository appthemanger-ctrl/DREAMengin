name: Create pnpm lockfile

on:
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (creates pnpm-lock.yaml if missing)
        run: pnpm install --no-frozen-lockfile

      - name: Create PR with pnpm lockfile
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: create pnpm lockfile"
          title: "chore: create pnpm lockfile"
          body: "Creates pnpm-lock.yaml using pnpm@10.4.0."
          branch: "chore/create-pnpm-lockfile"
          add-paths: |
            pnpm-lock.yaml
