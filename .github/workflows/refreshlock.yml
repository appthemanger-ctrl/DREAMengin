name: Create pnpm lockfile (direct push)

on:
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (creates pnpm-lock.yaml if missing)
        run: pnpm install --no-frozen-lockfile

      - name: Commit pnpm-lock.yaml if changed
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: create pnpm lockfile"
            git push origin main
          else
            echo "pnpm-lock.yaml unchanged; nothing to commit."
          fi
