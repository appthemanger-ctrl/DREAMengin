name: Create/Update pnpm lockfile (push)

on:
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      # Use the official setup-node@v6 – it will respect devEngines.runtime if present
      - name: Setup Node.js (respects devEngines)
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          # If you want to force a specific version, use node-version: '25'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Generate pnpm lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit & push pnpm-lock.yaml (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: add/update pnpm lockfile [skip ci] [skip vercel]"
          git push
