name: Docs Auto Update

# Combined replacement for four individual documentation-update workflows:
#   update-readme.yml · update-bugs.yml · update-handoff.yml · update-repo-state.yml
#
# Runs all four doc updates in sequence as a single workflow.
# One workflow entry in the Actions tab instead of four.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'   # weekly Monday 02:15 UTC
permissions:
  contents: write
concurrency:
  group: docs-auto-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/docs-auto-update.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
