name: Docs Auto Update

# Combined replacement for four individual documentation-update workflows:
#   update-readme.yml · update-bugs.yml · update-handoff.yml · update-repo-state.yml
#
# Runs all four doc updates in sequence as a single workflow.
# One workflow entry in the Actions tab instead of four.

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'   # weekly Monday 02:15 UTC

permissions:
  contents: write

concurrency:
  group: docs-auto-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    name: Update README · BUGS · HANDOFF · REPO_STATE
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Ensure README exists
        run: |
          if [ ! -f README.md ]; then
            echo "# DREAMenginOS" > README.md
            echo -e "\n## Current Implementation Status\n## Recent Changes" >> README.md
          fi

      - name: Update README
        run: node scripts/update-readme.mjs || true
        env:
          GITHUB_SHA:       ${{ github.sha }}
          GITHUB_REF_NAME:  ${{ github.ref_name }}
          GITHUB_ACTOR:     ${{ github.actor }}

      - name: Update BUGS.md
        run: node scripts/update-bugs.mjs || true
        env:
          GITHUB_SHA:       ${{ github.sha }}
          GITHUB_REF_NAME:  ${{ github.ref_name }}
          GITHUB_ACTOR:     ${{ github.actor }}

      - name: Update HANDOFF.md
        run: node scripts/update-handoff.mjs || true
        env:
          GITHUB_SHA:       ${{ github.sha }}
          GITHUB_REF_NAME:  ${{ github.ref_name }}
          GITHUB_ACTOR:     ${{ github.actor }}

      - name: Update REPO_STATE.md
        run: node scripts/analyze-repo-state.mjs || true

      - name: Commit all doc updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md docs/BUGS.md docs/HANDOFF.md REPO_STATE.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No doc changes to commit."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}..."
            if git commit -m "docs: auto-update README, BUGS, HANDOFF, REPO_STATE [skip ci] [skip vercel]" \
               && git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ Docs updated successfully."
              exit 0
            fi
            git reset --soft HEAD~1 2>/dev/null || true
            git pull --rebase origin ${{ github.ref_name }}
          done

          echo "❌ Failed to push after 3 attempts."
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Docs Auto Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Script | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| update-readme.mjs   | ran |" >> "$GITHUB_STEP_SUMMARY"
          echo "| update-bugs.mjs     | ran |" >> "$GITHUB_STEP_SUMMARY"
          echo "| update-handoff.mjs  | ran |" >> "$GITHUB_STEP_SUMMARY"
          echo "| analyze-repo-state.mjs | ran |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`${{ github.ref_name }}\` · Triggered by: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
