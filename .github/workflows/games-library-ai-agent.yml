name: Games Library AI Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # nightly evolution

jobs:
  evolve-games-library:
    name: Combine Genres + Polish SICC Games
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NODE_VERSION: '24'
      PNPM_VERSION: '10.30.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: completedream

      # 1. Catalog existing games with brief metadata
      - name: Catalog games
        run: |
          mkdir -p .github/generated
          python .github/scripts/catalog_games_for_ai.py > .github/generated/games-context.md || true

      # 2. AI chooses targets + genre fusions
      - name: AI select games + genre fusions
        id: ai_select
        env:
          CONTEXT_MD: .github/generated/games-context.md
        run: |
          CONTEXT=$(cat "$CONTEXT_MD" 2>/dev/null || echo "")
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg context "$CONTEXT" \
              '{
                model: "gpt-4.1",
                response_format: { type: "json_object" },
                messages: [{
                  role: "user",
                  content: ("You are the Games Library AI for DREAMengin.\n\nContext:\n" + $context + "\n\nPlatform rules:\n- Games live under the Games Daydream and are powered by GameEngin.\n- Each game must: run on Babylon.js 8+ WebGPU, mount as a Dream Window, respect privacy defaults (nothing public by default), remain SICC and fun.\n\nTask:\n1. Pick 1-3 existing games that can be improved by combining or bending genres.\n2. For each target, define: target slug, proposed genre mix (e.g. [\"tactics\", \"skater\", \"puzzle\"]), SICC upgrades (visual, control, UI/feedback), risk of losing coherence (and how to avoid it).\n\nOutput JSON only (array):\n[{\"slug\":\"existing_game_slug\",\"genre_mix\":[\"...\",\"...\"],\"sicc_upgrades\":{\"stylized\":\"...\",\"intuitive\":\"...\",\"cohesive\":\"...\",\"coherent\":\"...\"},\"notes\":\"...\"}]")
                }]
              }')"
          )
          echo "completion=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')" >> "$GITHUB_OUTPUT"

      - name: Save games evolution spec
        run: |
          mkdir -p .github/generated
          echo '${{ steps.ai_select.outputs.completion }}' > .github/generated/games-evolution.json

      # 3. AI applies coherent, unique changes to those games
      - name: AI patch selected games for genre fusion
        id: ai_patch
        env:
          EVOLUTION_JSON: .github/generated/games-evolution.json
        run: |
          EVOLUTION=$(cat "$EVOLUTION_JSON" 2>/dev/null || echo "[]")
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg evolution "$EVOLUTION" \
              '{
                model: "gpt-4.1",
                messages: [{
                  role: "user",
                  content: ("You are the implementation AI for the Games Library inside DREAMengin.\n\nTech: Babylon.js 8+ WebGPU, Next.js 16 + React 19 + TypeScript, GameEngin runtime (entity systems, Dream Windows, routing).\n\nEvolution spec:\n" + $evolution + "\n\nRules:\n- Only modify games under games/** that match the given slug values.\n- Keep each game unique; do NOT clone another game structure.\n- Implement genre fusion that: preserves a clear tight core loop, improves SICC along all four axes, maintains coherence with the existing game fantasy.\n- Ensure TypeScript strict compile passes.\n\nOutput: A unified diff (git patch) against games/** only, no other paths.")
                }]
              }')"
          )
          echo "completion=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')" >> "$GITHUB_OUTPUT"

      - name: Apply games patch
        continue-on-error: true
        run: |
          mkdir -p .github/generated
          echo '${{ steps.ai_patch.outputs.completion }}' > .github/generated/games-patch.diff
          git apply .github/generated/games-patch.diff || true

      - name: Commit and push changes
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Games Library AI Agent"
            git config user.email "games-library-ai@users.noreply.github.com"
            git commit -am "AI: evolve games library with genre fusion"
            git push origin completedream
          fi

      # Disc-only sandbox rule also applies to evolved games
      - name: Validate game sandbox rules (disc-only via GameEngin)
        run: |
          python .github/scripts/validate_game_sandbox.py

      # 4. Shallow validation (optional, non-blocking)
      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build games (subset)
        continue-on-error: true
        run: pnpm run build:games
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run games tests (subset)
        continue-on-error: true
        run: pnpm run test:games
