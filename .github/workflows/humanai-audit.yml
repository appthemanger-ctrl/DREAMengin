name: humanAI Website Audit

# ──────────────────────────────────────────────────────────────────────────────
# humanAI — Dynamic, no-Playwright website audit.
#
# humanAI browses DREAMengin like a real iPhone Safari user. It is *dynamic*:
# routes are discovered from app/**/page.tsx and from links found in the HTML
# the live server returns. There is no fixed test script and no headless
# browser. An optional GPT-4 persona pass turns the raw crawl into UX,
# accessibility and mobile findings phrased like a human reviewer.
#
# Triggers: workflow_dispatch, plus a weekly schedule.
# Required secret: OPENAI_API_KEY (optional — runs without it but skips the
# AI persona pass and emits a structural-only report).
# Optional secrets: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
# (used at build time so Supabase-aware pages render).
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum pages humanAI will crawl'
        required: false
        default: '25'
      open_issue:
        description: 'Open a GitHub issue with the report'
        type: boolean
        default: true
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
permissions:
  contents: read
  issues: write
concurrency:
  group: humanai-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/humanai-audit.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
