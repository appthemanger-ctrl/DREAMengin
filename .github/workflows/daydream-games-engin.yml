name: Games Daydream Lobby + GameEngin Runtime Health

# Builds, updates, checks, and auto-fixes the Games Daydream lobby and GameEngin runtime.
# Covers: app/daydream/games/, app/game/, components/daydream/GameEngin.tsx,
#         components/games/, app/api/game-scores/
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 4'   # weekly Thursday 05:00 UTC
permissions:
  contents: write
concurrency:
  group: daydream-games-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/daydream-games-engin.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
