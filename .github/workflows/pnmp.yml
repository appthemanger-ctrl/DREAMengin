name: Refresh pnpm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Create PR with updated lockfile
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh pnpm-lock.yaml"
          title: "chore: refresh pnpm-lock.yaml"
          body: "Runs pnpm install --no-frozen-lockfile to sync pnpm-lock.yaml with package.json."
          branch: "chore/refresh-pnpm-lock"
          add-paths: |
            pnpm-lock.yaml
