name: Create Daydream Lobby + ContentEngin Runtime Health

# Builds, updates, checks, and auto-fixes the Create Daydream lobby and ContentEngin runtime.
# Covers: app/daydream/create/, app/daydream/media-vault/, app/create/,
#         components/daydream/ContentEngin.tsx, app/notes/
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 3'   # weekly Wednesday 05:00 UTC
permissions:
  contents: write
concurrency:
  group: daydream-create-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/daydream-create-engin.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
