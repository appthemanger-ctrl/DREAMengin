name: Overwrite repo from root zip

on:
  push:
    branches: ["main"]
    paths:
      - "latest.zip"

jobs:
  overwrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip latest.zip to temp
        run: |
          rm -rf /tmp/new
          mkdir -p /tmp/new
          unzip -q latest.zip -d /tmp/new

      - name: Replace repo contents (keep .git + workflows + latest.zip)
        run: |
          set -e

          # If zip has single top-level folder, use it
          COUNT=$(find /tmp/new -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          if [ "$COUNT" = "1" ] && [ -d "$(find /tmp/new -mindepth 1 -maxdepth 1 -type d)" ]; then
            ROOT="$(find /tmp/new -mindepth 1 -maxdepth 1 -type d)"
          else
            ROOT="/tmp/new"
          fi

          # Delete everything except:
          # - .git
          # - .github (so workflows survive)
          # - latest.zip (so you can keep replacing it)
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "latest.zip" \
            -exec rm -rf {} +

          mkdir -p .github/workflows
          cp -a "$ROOT"/. .

      - name: Commit and push overwritten repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Overwrite repo from latest.zip" || exit 0
          git push
