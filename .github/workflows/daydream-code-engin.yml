name: Code Daydream Lobby + CodeEngin Runtime Health

# Builds, updates, checks, and auto-fixes the Code Daydream lobby and CodeEngin runtime.
# Covers: app/daydream/code/, app/codespace/, components/daydream/CodeEngin.tsx,
#         app/lab/, app/api/projects/
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 2'   # weekly Tuesday 05:00 UTC
permissions:
  contents: write
concurrency:
  group: daydream-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/daydream-code-engin.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
