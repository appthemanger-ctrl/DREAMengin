name: Code Daydream + CodeEngin Health

# Builds, updates, checks, and auto-fixes the Code Daydream and CodeEngin.
# Covers: app/daydream/code/, app/codespace/, components/daydream/CodeEngin.tsx,
#         app/lab/, app/api/projects/

on:
  push:
    paths:
      - 'app/daydream/code/**'
      - 'app/codespace/**'
      - 'components/daydream/CodeEngin.tsx'
      - 'app/lab/**'
      - 'app/api/projects/**'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'   # daily 05:00 UTC

permissions:
  contents: write

concurrency:
  group: daydream-code-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.30.0'
  DAYDREAM: 'code'
  ENGIN: 'CodeEngin'

jobs:
  health:
    name: Code Daydream · Build · Upgrade · Bug-Check · Fix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Toolchain ─────────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build check ───────────────────────────────────────────────────────────
      - name: Build (Next.js)
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ── Upgrade audit ─────────────────────────────────────────────────────────
      - name: Check for outdated packages
        run: pnpm outdated || true

      - name: Security audit
        run: pnpm audit --audit-level=high || true

      # ── Bug check ─────────────────────────────────────────────────────────────
      - name: Lint (Code Daydream scope)
        id: lint
        run: |
          pnpm lint \
            --file app/daydream/code \
            --file app/codespace \
            --file components/daydream/CodeEngin.tsx \
            || echo "lint_failed=true" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm typecheck || true

      - name: Unit tests
        run: pnpm exec vitest run --reporter=verbose || true

      # ── Auto-fix ──────────────────────────────────────────────────────────────
      - name: ESLint auto-fix (Code Daydream)
        run: |
          pnpm exec next lint \
            --fix \
            --dir app/daydream/code \
            --dir app/codespace \
            || true

      # ── Commit fixes ──────────────────────────────────────────────────────────
      - name: Commit auto-fixes (if any)
        run: |
          git config user.name  "daydream-code-bot"
          git config user.email "daydream-code-bot@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No fixes to commit."
          else
            git add -A
            git commit -m "fix(code-daydream): ESLint auto-fix in Code Daydream + CodeEngin [skip ci]"
            git push || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Daydream | Code |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Engine | CodeEngin |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
