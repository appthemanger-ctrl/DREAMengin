name: Daydream Lobby + Engin Runtime Build Cycle

# Continuously builds all 6 Daydream-lobby + Engin-runtime pairs toward feature completeness,
# then shifts into a SICC UI-refinement cycle once a pair is feature-maxed.
#
# Two phases per pair:
#   BUILD  — scans codebase for planned features, reports gaps, drives integration.
#   REFINE — all features implemented; audits UI quality (Stylized · Intuitive ·
#             Cohesive · Coherent) and files refinement opportunities.
#
# Pairs covered:
#   Music / StarMakerEngin   · Games / GameEngin      · Lab / LabEngin
#   Code  / CodeEngin        · Brand / BrandingEngin  · Create / ContentEngin
#
# Triggers:
#   push   — any Daydream lobby surface or Engin runtime component file changes
#   weekly — Sunday 06:00 UTC (ensures all pairs are checked regularly)
#   manual — workflow_dispatch for on-demand cycle runs
on:
  schedule:
    - cron: '0 6 * * 0'   # weekly, Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      pair:
        description: 'Run cycle for a specific pair (music|games|lab|code|brand|create) or "all"'
        required: false
        default: 'all'
permissions:
  contents: write
  issues: write
concurrency:
  group: daydream-engin-build-cycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/daydream-engin-build-cycle.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
