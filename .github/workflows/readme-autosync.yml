name: README Autosync

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-autosync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autosync:
    name: Regenerate touched README sections
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          CHANGED_FILE_LIST="$RUNNER_TEMP/readme-autosync-changed-files.txt"
          BASE_SHA=""

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$BEFORE_SHA"
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD~1)"
            fi
          fi

          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$GITHUB_SHA" > "$CHANGED_FILE_LIST"
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > "$CHANGED_FILE_LIST"
          fi

          echo "changed_files_path=$CHANGED_FILE_LIST" >> "$GITHUB_OUTPUT"

      - name: Regenerate affected README sections
        id: autosync
        run: |
          pnpm tsx scripts/readme-autosync.ts \
            --changed-files "${{ steps.changes.outputs.changed_files_path }}" \
            --summary-file "$RUNNER_TEMP/readme-autosync-summary.json"

          if git diff --quiet README.md; then
            echo "readme_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "readme_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose sticky PR comment body
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          SUMMARY_FILE="$RUNNER_TEMP/readme-autosync-summary.json"
          COMMENT_FILE="$RUNNER_TEMP/readme-autosync-comment.md"

          node <<'NODE'
          const fs = require('fs');
          const summaryPath = process.env.SUMMARY_FILE;
          const commentPath = process.env.COMMENT_FILE;
          const isFork = process.env.IS_FORK === 'true';

          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const sections = summary.regeneratedSections || [];
          const subsections = summary.regeneratedSubsections || [];

          const lines = [
            '<!-- readme-autosync -->',
            '## 📖 README autosync',
            '',
            summary.readmeChanged
              ? 'README.md was updated for changed subsystem section(s).'
              : 'No README section updates were required for this change set.',
            '',
            `- Changed files evaluated: **${(summary.changedFiles || []).length}**`,
            `- Sections regenerated: **${sections.length}**`,
          ];

          if (sections.length > 0) {
            lines.push('', '### Sections regenerated');
            for (const section of sections) {
              lines.push(`- \`${section.id}\` — ${section.title}`);
            }
          }

          if (subsections.length > 0) {
            lines.push('', '### Targeted subsection refreshes');
            for (const subsection of subsections) {
              lines.push(`- \`${subsection.sectionId}/${subsection.subsectionId}\` — ${subsection.title}`);
            }
          }

          if (isFork && summary.readmeChanged) {
            lines.push('', 'Fork PR detected: write access is unavailable, so updated README.md is attached as an artifact.');
          }

          fs.writeFileSync(commentPath, `${lines.join('\n')}\n`);
          NODE
        env:
          SUMMARY_FILE: ${{ runner.temp }}/readme-autosync-summary.json
          COMMENT_FILE: ${{ runner.temp }}/readme-autosync-comment.md
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Commit README update on default-branch push
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && steps.autosync.outputs.readme_changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): autosync touched sections [skip ci]"
          git push

      - name: Commit README update on same-repo pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.autosync.outputs.readme_changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): autosync touched sections [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload README artifact for fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && steps.autosync.outputs.readme_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: readme-autosync
          path: README.md

      - name: Upsert sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body &&
              comment.body.includes('<!-- readme-autosync -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          COMMENT_FILE: ${{ runner.temp }}/readme-autosync-comment.md

      - name: Step summary
        if: always()
        shell: bash
        run: |
          echo "## README autosync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/readme-autosync-summary.json" >> "$GITHUB_STEP_SUMMARY"
