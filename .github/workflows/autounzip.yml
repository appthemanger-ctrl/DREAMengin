name: Unpack Into Root (SemVer Only, Safe Overlay)

on:
  push:
    paths:
      - 'DREAMENGIN-v*.zip'
      - 'DREAMENGIN-v*.tar.gz'
      - 'DREAMENGIN-v*.tgz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Apply newest SemVer archive into repo root (safe overlay + unwrap)
        shell: bash
        run: |
          set -euo pipefail

          # Only accept SemVer artifacts: DREAMENGIN-vMAJOR.MINOR.PATCH.(zip|tgz|tar.gz)
          candidates="$(
            git ls-files -z \
              'DREAMENGIN-v[0-9]*.[0-9]*.[0-9]*.zip' \
              'DREAMENGIN-v[0-9]*.[0-9]*.[0-9]*.tar.gz' \
              'DREAMENGIN-v[0-9]*.[0-9]*.[0-9]*.tgz' \
            | xargs -0 -n1 || true
          )"

          if [ -z "${candidates:-}" ]; then
            echo "No SemVer artifacts found. Expected: DREAMENGIN-vX.Y.Z.zip|tgz|tar.gz"
            exit 0
          fi

          # Pick newest by last commit timestamp touching the file
          pack="$(
            printf "%s\n" "$candidates" |
            xargs -I{} sh -c 'printf "%s\t%s\n" "$(git log -1 --format=%ct -- "{}" 2>/dev/null || echo 0)" "{}"' |
            sort -nr | head -1 | cut -f2-
          )"

          echo "Using: $pack"

          tmp="$(mktemp -d)"
          out="$tmp/out"
          mkdir -p "$out"

          # Unpack into temp (more reliable than extracting into repo root)
          if [[ "$pack" == *.zip ]]; then
            unzip -o "$pack" -d "$out" >/dev/null
          else
            tar -xf "$pack" -C "$out"
          fi

          # Remove macOS/iOS junk that breaks wrapper detection
          rm -rf "$out/__MACOSX" || true

          # Unwrap “second layer” if there's exactly one wrapper folder
          src="$out"
          count="$(ls -A "$out" | wc -l | tr -d ' ')"
          if [ "$count" -eq 1 ]; then
            only="$(ls -A "$out")"
            if [ -d "$out/$only" ]; then
              echo "Wrapper folder detected ($only) -> using second layer"
              src="$out/$only"
            fi
          fi

          # Refuse empty package
          if [ -z "$(ls -A "$src" || true)" ]; then
            echo "ERROR: artifact empty after unpack"
            exit 1
          fi

          # IMPORTANT: Never allow .github from the artifact.
          # If your zip includes .github (common when zipping the whole repo), we ignore it automatically.
          rm -rf "$src/.github" || true

          # Determine top-level targets to replace (AFTER removing .github)
          (cd "$src" && find . -mindepth 1 -maxdepth 1 -printf '%P\n') | sort > "$tmp/targets.txt"

          # Also ensure targets list can never include .github
          grep -vx '.github' "$tmp/targets.txt" > "$tmp/targets.filtered.txt" || true
          mv "$tmp/targets.filtered.txt" "$tmp/targets.txt"

          echo "Top-level targets to replace:"
          cat "$tmp/targets.txt" || true

          if [ ! -s "$tmp/targets.txt" ]; then
            echo "ERROR: no targets found"
            exit 1
          fi

          # Safe overlay: delete only what the artifact is replacing
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            [ "$entry" = ".git" ] && continue
            echo "Removing existing target: ./$entry"
            rm -rf "./$entry"
          done < "$tmp/targets.txt"

          # Copy into repo root
          echo "Copying into repo root..."
          shopt -s dotglob
          cp -a "$src"/* .
          shopt -u dotglob

      - name: Commit and push (never modify workflows)
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Hard-protect workflows from ever being committed by this job
          git restore --source=HEAD --staged --worktree .github/workflows || true

          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply SemVer artifact to root"
          git push
