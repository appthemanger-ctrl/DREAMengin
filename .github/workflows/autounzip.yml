name: Unpack Into Root (Safe Overlay, Second Layer, NO TEMP)

on:
  push:
    paths:
      - '**/*.zip'
      - '**/*.tar.gz'
      - '**/*.tgz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Apply newest archive into repo root (safe overlay + unwrap single top folder)
        shell: bash
        run: |
          set -euo pipefail

          # Find newest tracked archive
          pack="$(
            git ls-files -z '*.zip' '*.tar.gz' '*.tgz' |
            xargs -0 -n1 |
            xargs -I{} sh -c 'printf "%s\t%s\n" "$(git log -1 --format=%ct -- "{}" 2>/dev/null || echo 0)" "{}"' |
            sort -nr | head -1 | cut -f2-
          )"

          if [ -z "${pack:-}" ]; then
            echo "No .zip/.tar.gz/.tgz found"
            exit 0
          fi

          echo "Using: $pack"

          # List files in archive (WITHOUT extracting)
          # Then compute top-level entries (targets) and detect wrapper folder
          targets_file="$(mktemp)"
          wrapper_file="$(mktemp)"

          if [[ "$pack" == *.zip ]]; then
            # zip listing: one file per line
            unzip -Z1 "$pack" \
              | sed 's#^\./##' \
              | grep -v '^__MACOSX/' \
              | awk -F/ 'NF{print $1}' \
              | sort -u > "$targets_file"
          else
            # tar listing: one file per line
            tar -tf "$pack" \
              | sed 's#^\./##' \
              | grep -v '^__MACOSX/' \
              | awk -F/ 'NF{print $1}' \
              | sort -u > "$targets_file"
          fi

          echo "Top-level targets in archive:"
          cat "$targets_file" || true

          if [ ! -s "$targets_file" ]; then
            echo "ERROR: No targets found in archive; refusing."
            exit 1
          fi

          # Guardrails
          if grep -qx '.git' "$targets_file"; then
            echo "ERROR: archive contains .git; refusing."
            exit 1
          fi
          if grep -qx '.github' "$targets_file"; then
            echo "ERROR: archive contains .github; refusing (protect workflows)."
            exit 1
          fi

          # Detect wrapper folder: if exactly one top-level entry and it's a directory after extract
          wrapper=""
          if [ "$(wc -l < "$targets_file" | tr -d ' ')" -eq 1 ]; then
            wrapper="$(cat "$targets_file")"
            echo "$wrapper" > "$wrapper_file"
            echo "Wrapper candidate: $wrapper"
          else
            echo "" > "$wrapper_file"
          fi

          # SAFE overlay delete: remove only what the archive will replace
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            echo "Removing existing target: ./$entry"
            rm -rf "./$entry"
          done < "$targets_file"

          # Extract INTO ROOT
          if [[ "$pack" == *.zip ]]; then
            unzip -o "$pack" -d . >/dev/null
          else
            # -xf auto-detects gzip; safer than -xzf
            tar -xf "$pack" -C .
          fi

          # Remove mac zip junk if it appeared
          rm -rf "__MACOSX" || true

          # Unwrap second layer if wrapper folder was detected and exists
          wrapper="$(cat "$wrapper_file" || true)"
          if [ -n "${wrapper:-}" ] && [ -d "./$wrapper" ]; then
            echo "Unwrapping second layer folder: $wrapper"
            shopt -s dotglob
            cp -a "./$wrapper"/* .
            shopt -u dotglob
            rm -rf "./$wrapper"
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unpack into root (safe overlay, second layer)"
          git push
