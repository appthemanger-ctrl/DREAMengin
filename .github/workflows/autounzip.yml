name: Auto Extract Archives

on:
  push:
    paths:
      - '**.zip'
      - '**.tar.gz'
      - '**.tgz'
  workflow_dispatch:
    inputs:
      force_reextract:
        description: "Re-extract even if destination folder already exists"
        required: false
        default: "false"
      max_size_mb:
        description: "Max archive size (MB)"
        required: false
        default: "500"
      max_files:
        description: "Max extracted files"
        required: false
        default: "10000"

env:
  MAX_SIZE_MB: ${{ inputs.max_size_mb || 500 }}
  MAX_FILES: ${{ inputs.max_files || 10000 }}
  FORCE_REEXTRACT: ${{ inputs.force_reextract == 'true' && '1' || '' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup extraction environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip p7zip-full p7zip-rar

      - name: Find and validate archives
        id: find
        run: |
          echo "::group::Finding archives"
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) ! -path "./.git/*" > /tmp/archives.txt

          if [ ! -s /tmp/archives.txt ]; then
            echo "No archives found"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found archives:"
          cat /tmp/archives.txt
          echo "found=true" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: Extract archives with error handling (root output)
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail

          failed=0
          extracted=0

          ROOT_OUT_DIR="_extracted"
          mkdir -p "$ROOT_OUT_DIR"

          strip_ext() {
            local f="$1"
            f="${f%.tar.gz}"
            f="${f%.tgz}"
            f="${f%.zip}"
            echo "$f"
          }

          while IFS= read -r archive; do
            echo "::group::Processing: $archive"

            archive_base="$(basename "$archive")"
            name="$(strip_ext "$archive_base")"
            extract_dir="${GITHUB_WORKSPACE}/${ROOT_OUT_DIR}/${name}"

            if [ -d "$extract_dir" ] && [ -z "${FORCE_REEXTRACT:-}" ]; then
              echo "⚠️  Skipping: $extract_dir already exists (set FORCE_REEXTRACT to override)"
              echo "::endgroup::"
              continue
            fi

            size_mb=$(du -m "$archive" | cut -f1)
            if [ "$size_mb" -gt "$MAX_SIZE_MB" ]; then
              echo "❌ ERROR: $archive (${size_mb}MB) exceeds limit (${MAX_SIZE_MB}MB)"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi

            if [ -d "$extract_dir" ]; then
              echo "🗑️  Removing existing: $extract_dir"
              rm -rf "$extract_dir"
            fi

            mkdir -p "$extract_dir"
            success=false

            if [[ "$archive" == *.zip ]]; then
              echo "📦 Extracting ZIP -> $extract_dir"
              if unzip -o "$archive" -d "$extract_dir" 2>/tmp/unzip_error.log; then
                nested=$(find "$extract_dir" -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) | wc -l)
                if [ "$nested" -gt 0 ]; then
                  echo "⚠️  Warning: $nested nested archives found (not auto-extracted)"
                fi
                success=true
              else
                echo "❌ ZIP extraction failed:"
                cat /tmp/unzip_error.log
                rm -rf "$extract_dir"
              fi

            elif [[ "$archive" == *.tar.gz ]] || [[ "$archive" == *.tgz ]]; then
              echo "📦 Extracting TAR.GZ -> $extract_dir"
              if tar -xzf "$archive" -C "$extract_dir" 2>/tmp/tar_error.log; then
                root_items=$(ls -A "$extract_dir" | wc -l)
                if [ "$root_items" -eq 1 ]; then
                  only="$(ls -A "$extract_dir")"
                  if [ -d "$extract_dir/$only" ]; then
                    echo "📁 Flattening single root folder: $only"
                    shopt -s dotglob
                    mv "$extract_dir/$only"/* "$extract_dir/" 2>/dev/null || true
                    shopt -u dotglob
                    rmdir "$extract_dir/$only" 2>/dev/null || true
                  fi
                fi
                success=true
              else
                echo "❌ TAR extraction failed:"
                cat /tmp/tar_error.log
                rm -rf "$extract_dir"
              fi
            fi

            if [ "$success" = true ]; then
              file_count=$(find "$extract_dir" -type f | wc -l)

              if [ "$file_count" -eq 0 ]; then
                echo "❌ ERROR: No files extracted"
                rm -rf "$extract_dir"
                failed=$((failed + 1))
              elif [ "$file_count" -gt "$MAX_FILES" ]; then
                echo "❌ ERROR: Too many files ($file_count > $MAX_FILES)"
                rm -rf "$extract_dir"
                failed=$((failed + 1))
              else
                echo "✅ Success: $file_count files extracted to $extract_dir"
                extracted=$((extracted + 1))
              fi
            else
              failed=$((failed + 1))
            fi

            echo "::endgroup::"
          done < /tmp/archives.txt

          echo "SUMMARY: $extracted extracted, $failed failed"

          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed archive(s) failed to extract"
          fi

          if [ "$extracted" -eq 0 ]; then
            echo "Nothing to commit"
            exit 0
          fi

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          echo "Changes to commit:"
          git diff --cached --stat

          commit_msg="Auto-extract: Extracted archives [$(date +%Y-%m-%d_%H:%M:%S)]

          Extracted files:
          $(git diff --cached --name-only | grep -vE '\.zip$|\.tar\.gz$|\.tgz$' | head -20)

          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_id }}"

          git commit -m "$commit_msg"

          for i in 1 2 3; do
            if git push; then
              echo "✅ Push successful"
              exit 0
            else
              echo "⚠️  Push failed, attempt $i/3"
              git pull --rebase origin "${{ github.ref_name }}" || true
              sleep 2
            fi
          done

          echo "❌ Failed to push after 3 attempts"
          exit 1
        
