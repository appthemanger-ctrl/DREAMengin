name: Unpack Uploads Into Repo Root

on:
  push:
    paths:
      - '**/*.zip'
      - '**/*.tar.gz'
      - '**/*.tgz'
  workflow_dispatch:
    inputs:
      clean_repo:
        description: "Delete everything except .github before writing extracted content into repo root"
        required: false
        default: "true"
      max_size_mb:
        description: "Max compressed file size (MB)"
        required: false
        default: "500"
      max_files:
        description: "Max extracted files"
        required: false
        default: "10000"

env:
  MAX_SIZE_MB: ${{ inputs.max_size_mb || 500 }}
  MAX_FILES: ${{ inputs.max_files || 10000 }}
  CLEAN_REPO: ${{ inputs.clean_repo != 'false' && '1' || '' }}

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

      - name: Locate compressed files
        id: locate
        run: |
          set -euo pipefail
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) ! -path "./.git/*" > /tmp/packs.txt || true
          if [ ! -s /tmp/packs.txt ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No compressed files found"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Found:"
          cat /tmp/packs.txt

      - name: Unpack into repo root (flatten single wrapper folder)
        if: steps.locate.outputs.found == 'true'
        run: |
          set -euo pipefail

          STAGE="$(mktemp -d)"
          ROOT_PAYLOAD="$STAGE/__root__"
          mkdir -p "$ROOT_PAYLOAD"

          # 1) Unpack everything into a single root payload
          while IFS= read -r pack; do
            echo "::group::Unpacking: $pack"

            size_mb=$(du -m "$pack" | cut -f1)
            if [ "$size_mb" -gt "$MAX_SIZE_MB" ]; then
              echo "❌ Too large: $pack (${size_mb}MB > ${MAX_SIZE_MB}MB)"
              echo "::endgroup::"
              continue
            fi

            out="$STAGE/out_$(date +%s%N)"
            mkdir -p "$out"

            if [[ "$pack" == *.zip ]]; then
              unzip -o "$pack" -d "$out" >/dev/null
            else
              tar -xzf "$pack" -C "$out"
            fi

            file_count=$(find "$out" -type f | wc -l)
            if [ "$file_count" -eq 0 ]; then
              echo "❌ No files unpacked"
              rm -rf "$out"
              echo "::endgroup::"
              continue
            fi
            if [ "$file_count" -gt "$MAX_FILES" ]; then
              echo "❌ Too many files: $file_count > $MAX_FILES"
              rm -rf "$out"
              echo "::endgroup::"
              continue
            fi

            # Flatten if there's a single wrapper directory
            items=$(ls -A "$out" | wc -l)
            src="$out"
            if [ "$items" -eq 1 ]; then
              only="$(ls -A "$out")"
              if [ -d "$out/$only" ]; then
                echo "📁 Flattening wrapper folder: $only"
                src="$out/$only"
              fi
            fi

            # Merge into root payload (later packs overwrite earlier)
            shopt -s dotglob
            cp -a "$src"/* "$ROOT_PAYLOAD/" 2>/dev/null || true
            shopt -u dotglob

            echo "✅ Added $file_count files to root payload"
            echo "::endgroup::"
          done < /tmp/packs.txt

          # 2) Clean repo root but keep workflow
          if [ -n "${CLEAN_REPO:-}" ]; then
            echo "::group::Cleaning repo root (keeping .github + .git)"
            find . -mindepth 1 -maxdepth 1 \
              ! -name ".git" \
              ! -name ".github" \
              -exec rm -rf {} +
            echo "::endgroup::"
          fi

          # 3) Copy payload INTO repo root
          echo "::group::Writing into repo root"
          shopt -s dotglob
          cp -a "$ROOT_PAYLOAD"/* . 2>/dev/null || true
          shopt -u dotglob
          echo "::endgroup::"

      - name: Commit and push result
        if: steps.locate.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unpack uploads into repo root [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
