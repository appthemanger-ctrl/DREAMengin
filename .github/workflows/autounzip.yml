name: Auto Extract Archives (Extract INTO ROOT)

on:
  push:
    paths:
      - '**.zip'
      - '**.tar.gz'
      - '**.tgz'
  workflow_dispatch:
    inputs:
      clean_repo:
        description: "Delete everything except .github before writing extracted output to root"
        required: false
        default: "true"
      force_overwrite:
        description: "Overwrite existing files in repo root with extracted files"
        required: false
        default: "true"
      max_size_mb:
        description: "Max archive size (MB)"
        required: false
        default: "500"
      max_files:
        description: "Max extracted files"
        required: false
        default: "10000"

env:
  MAX_SIZE_MB: ${{ inputs.max_size_mb || 500 }}
  MAX_FILES: ${{ inputs.max_files || 10000 }}
  CLEAN_REPO: ${{ inputs.clean_repo != 'false' && '1' || '' }}
  FORCE_OVERWRITE: ${{ inputs.force_overwrite != 'false' && '1' || '' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup extraction environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

      - name: Find archives
        id: find
        run: |
          set -euo pipefail
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) ! -path "./.git/*" > /tmp/archives.txt || true
          if [ ! -s /tmp/archives.txt ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No archives found"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Archives:"
          cat /tmp/archives.txt

      - name: Extract INTO repo root (flatten if archive has a single top folder)
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail

          # --- 1) Stage extraction into temp dir (safe) ---
          STAGE="$(mktemp -d)"
          echo "Staging to: $STAGE"

          # Extract each archive into its own staging subdir first
          idx=0
          staged_any=0

          while IFS= read -r archive; do
            echo "::group::Staging: $archive"
            idx=$((idx+1))
            out="$STAGE/$idx"
            mkdir -p "$out"

            # Size guard
            size_mb=$(du -m "$archive" | cut -f1)
            if [ "$size_mb" -gt "$MAX_SIZE_MB" ]; then
              echo "❌ ERROR: $archive (${size_mb}MB) exceeds limit (${MAX_SIZE_MB}MB)"
              rm -rf "$out"
              echo "::endgroup::"
              continue
            fi

            if [[ "$archive" == *.zip ]]; then
              if unzip -o "$archive" -d "$out" 2>/tmp/unzip_error.log; then
                :
              else
                echo "❌ ZIP extraction failed:"
                cat /tmp/unzip_error.log
                rm -rf "$out"
                echo "::endgroup::"
                continue
              fi
            else
              if tar -xzf "$archive" -C "$out" 2>/tmp/tar_error.log; then
                :
              else
                echo "❌ TAR extraction failed:"
                cat /tmp/tar_error.log
                rm -rf "$out"
                echo "::endgroup::"
                continue
              fi
            fi

            # Validate file count
            file_count=$(find "$out" -type f | wc -l)
            if [ "$file_count" -eq 0 ]; then
              echo "❌ ERROR: No files extracted"
              rm -rf "$out"
              echo "::endgroup::"
              continue
            fi
            if [ "$file_count" -gt "$MAX_FILES" ]; then
              echo "❌ ERROR: Too many files ($file_count > $MAX_FILES)"
              rm -rf "$out"
              echo "::endgroup::"
              continue
            fi

            echo "✅ Staged: $file_count files"
            staged_any=1
            echo "::endgroup::"
          done < /tmp/archives.txt

          if [ "$staged_any" -eq 0 ]; then
            echo "Nothing staged; exiting."
            exit 0
          fi

          # --- 2) Choose what to copy into root ---
          # If multiple archives exist, we merge them into root in numeric order (later archives win on conflicts if FORCE_OVERWRITE=1)
          echo "::group::Preparing root payload"
          ROOT_PAYLOAD="$STAGE/__root__"
          mkdir -p "$ROOT_PAYLOAD"

          for d in "$STAGE"/*; do
            [ -d "$d" ] || continue
            base="$(basename "$d")"
            [ "$base" = "__root__" ] && continue

            # Flatten single top-level folder if present
            # If the staged dir contains exactly one item and it's a directory, treat that as root
            items=$(ls -A "$d" | wc -l)
            src="$d"
            if [ "$items" -eq 1 ]; then
              only="$(ls -A "$d")"
              if [ -d "$d/$only" ]; then
                src="$d/$only"
                echo "📁 Flattening single top folder: $only"
              fi
            fi

            # Copy into root payload
            shopt -s dotglob
            if [ -n "${FORCE_OVERWRITE:-}" ]; then
              cp -a "$src"/* "$ROOT_PAYLOAD/" 2>/dev/null || true
            else
              # no-overwrite: copy only missing files (best-effort)
              for p in "$src"/*; do
                rel="$(basename "$p")"
                [ -e "$ROOT_PAYLOAD/$rel" ] && continue
                cp -a "$p" "$ROOT_PAYLOAD/" 2>/dev/null || true
              done
            fi
            shopt -u dotglob
          done
          echo "::endgroup::"

          # --- 3) Optional clean repo (keep .github + .git) ---
          if [ -n "${CLEAN_REPO:-}" ]; then
            echo "::group::Cleaning repo root (keeping .github + .git)"
            find . -mindepth 1 -maxdepth 1 \
              ! -name ".git" \
              ! -name ".github" \
              -exec rm -rf {} +
            echo "::endgroup::"
          fi

          # --- 4) Copy payload INTO repo root ---
          echo "::group::Writing into repo root"
          shopt -s dotglob
          cp -a "$ROOT_PAYLOAD"/* . 2>/dev/null || true
          shopt -u dotglob
          echo "::endgroup::"

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-extract: write archives into repo root [$(date -u +%Y-%m-%dT%H:%M:%SZ)]" || exit 0

          for i in 1 2 3; do
            if git push; then
              echo "Push successful"
              exit 0
            fi
            echo "Push failed ($i/3) — rebasing and retrying"
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep 2
          done

          echo "Failed to push after 3 attempts"
          exit 1
