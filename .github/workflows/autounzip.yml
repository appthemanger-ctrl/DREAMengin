name: Unpack Into Root (Safe Overlay, Second Layer)

on:
  push:
    paths:
      - '**/*.zip'
      - '**/*.tar.gz'
      - '**/*.tgz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Unpack newest upload into repo root (SAFE overlay, extract second layer if wrapped)
        shell: bash
        run: |
          set -euo pipefail

          # newest compressed file (by last commit touching the file)
          pack="$(
            git ls-files -z '*.zip' '*.tar.gz' '*.tgz' |
            xargs -0 -n1 |
            xargs -I{} sh -c 'printf "%s\t%s\n" "$(git log -1 --format=%ct -- "{}" 2>/dev/null || echo 0)" "{}"' |
            sort -nr | head -1 | cut -f2-
          )"

          if [ -z "${pack:-}" ]; then
            echo "No .zip/.tar.gz/.tgz found"
            exit 0
          fi

          echo "Using: $pack"

          tmp="$(mktemp -d)"
          out="$tmp/out"
          mkdir -p "$out"

          # unpack into temp
          if [[ "$pack" == *.zip ]]; then
            unzip -o "$pack" -d "$out" >/dev/null
          else
            tar -xzf "$pack" -C "$out"
          fi

          # extract second layer: if unpacked output is a single directory, use its contents as root
          src="$out"
          count="$(ls -A "$out" | wc -l | tr -d ' ')"
          if [ "$count" -eq 1 ]; then
            only="$(ls -A "$out")"
            if [ -d "$out/$only" ]; then
              echo "Wrapper folder detected ($only) -> using second layer"
              src="$out/$only"
            fi
          fi

          # safety: refuse empty package
          if [ -z "$(ls -A "$src" || true)" ]; then
            echo "ERROR: Unpacked package is empty; refusing."
            exit 1
          fi

          # compute top-level targets in the package (these are what we'll replace)
          (cd "$src" && find . -mindepth 1 -maxdepth 1 -printf '%P\n') | sort > "$tmp/targets.txt"

          echo "Top-level targets to replace:"
          cat "$tmp/targets.txt"

          if [ ! -s "$tmp/targets.txt" ]; then
            echo "ERROR: No targets found in package; refusing."
            exit 1
          fi

          # guardrail: don't allow .git ever, and block .github to avoid nuking workflows unless you REALLY intend it
          if grep -qx '.git' "$tmp/targets.txt"; then
            echo "ERROR: package contains .git; refusing."
            exit 1
          fi
          if grep -qx '.github' "$tmp/targets.txt"; then
            echo "ERROR: package contains .github; refusing (to protect workflows)."
            echo "If you truly want to replace workflows, remove this guardrail intentionally."
            exit 1
          fi

          # SAFE overlay: delete only what the package is replacing (top-level), then copy into repo root
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            echo "Removing existing target: ./$entry"
            rm -rf "./$entry"
          done < "$tmp/targets.txt"

          echo "Copying unpacked content into repo root..."
          shopt -s dotglob
          cp -a "$src"/* .
          shopt -u dotglob

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unpack into root (safe overlay, second layer)"
          git push
