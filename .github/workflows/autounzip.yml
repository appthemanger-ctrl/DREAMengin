name: Auto Extract Archives (Clean + Extract)

on:
  push:
    paths:
      - '**.zip'
      - '**.tar.gz'
      - '**.tgz'
  workflow_dispatch:
    inputs:
      force_reextract:
        description: "Re-extract even if destination folder already exists"
        required: false
        default: "false"
      clean_repo:
        description: "Delete everything except .github (this workflow) before writing extracted output"
        required: false
        default: "true"

env:
  MAX_SIZE_MB: 500
  MAX_FILES: 10000
  FORCE_REEXTRACT: ${{ inputs.force_reextract == 'true' && '1' || '' }}
  CLEAN_REPO: ${{ inputs.clean_repo != 'false' && '1' || '' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup extraction environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip p7zip-full p7zip-rar

      - name: Find archives
        id: find
        run: |
          set -euo pipefail
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) ! -path "./.git/*" > /tmp/archives.txt || true
          if [ ! -s /tmp/archives.txt ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No archives found"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Archives:"
          cat /tmp/archives.txt

      - name: Extract to repo (clean first, keep workflow)
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail

          strip_ext() {
            local f="$1"
            f="${f%.tar.gz}"
            f="${f%.tgz}"
            f="${f%.zip}"
            echo "$f"
          }

          # 1) Extract everything into a temp staging dir first (so we can safely clean the repo)
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE"
          failed=0
          extracted=0

          while IFS= read -r archive; do
            echo "::group::Extracting: $archive"

            archive_base="$(basename "$archive")"
            name="$(strip_ext "$archive_base")"
            out_dir="$STAGE/$name"

            # Size guard
            size_mb=$(du -m "$archive" | cut -f1)
            if [ "$size_mb" -gt "$MAX_SIZE_MB" ]; then
              echo "❌ ERROR: $archive (${size_mb}MB) exceeds limit (${MAX_SIZE_MB}MB)"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi

            # Allow re-extract in staging always
            rm -rf "$out_dir"
            mkdir -p "$out_dir"

            success=false
            if [[ "$archive" == *.zip ]]; then
              if unzip -o "$archive" -d "$out_dir" 2>/tmp/unzip_error.log; then
                success=true
              else
                echo "❌ ZIP extraction failed:"
                cat /tmp/unzip_error.log
                rm -rf "$out_dir"
              fi
            else
              if tar -xzf "$archive" -C "$out_dir" 2>/tmp/tar_error.log; then
                # Flatten single root folder (incl dotfiles)
                root_items=$(ls -A "$out_dir" | wc -l)
                if [ "$root_items" -eq 1 ]; then
                  only="$(ls -A "$out_dir")"
                  if [ -d "$out_dir/$only" ]; then
                    shopt -s dotglob
                    mv "$out_dir/$only"/* "$out_dir/" 2>/dev/null || true
                    shopt -u dotglob
                    rmdir "$out_dir/$only" 2>/dev/null || true
                  fi
                fi
                success=true
              else
                echo "❌ TAR extraction failed:"
                cat /tmp/tar_error.log
                rm -rf "$out_dir"
              fi
            fi

            if [ "$success" = true ]; then
              file_count=$(find "$out_dir" -type f | wc -l)
              if [ "$file_count" -eq 0 ]; then
                echo "❌ ERROR: No files extracted"
                rm -rf "$out_dir"
                failed=$((failed + 1))
              elif [ "$file_count" -gt "$MAX_FILES" ]; then
                echo "❌ ERROR: Too many files ($file_count > $MAX_FILES)"
                rm -rf "$out_dir"
                failed=$((failed + 1))
              else
                echo "✅ Staged: $file_count files -> $name/"
                extracted=$((extracted + 1))
              fi
            else
              failed=$((failed + 1))
            fi

            echo "::endgroup::"
          done < /tmp/archives.txt

          echo "SUMMARY: staged=$extracted failed=$failed"
          if [ "$extracted" -eq 0 ]; then
            echo "Nothing staged; exiting."
            exit 0
          fi

          # 2) Optional: clean repo (keep .git + .github only)
          if [ -n "${CLEAN_REPO:-}" ]; then
            echo "::group::Cleaning repo (keeping .github + .git)"
            # Delete everything at repo root except .git and .github
            find . -mindepth 1 -maxdepth 1 \
              ! -name ".git" \
              ! -name ".github" \
              -exec rm -rf {} +
            echo "::endgroup::"
          fi

          # 3) Write staged output into repo root as folders named after each archive
          echo "::group::Writing extracted output to repo root"
          while IFS= read -r archive; do
            archive_base="$(basename "$archive")"
            name="$(strip_ext "$archive_base")"
            src="$STAGE/$name"
            dst="./$name"

            if [ ! -d "$src" ]; then
              continue
            fi

            if [ -d "$dst" ] && [ -z "${FORCE_REEXTRACT:-}" ]; then
              echo "⚠️  Skipping write: $dst exists (set force_reextract=true to overwrite)"
              continue
            fi

            rm -rf "$dst"
            mkdir -p "$dst"

            # Copy staged files into destination
            # Preserve structure, include dotfiles
            shopt -s dotglob
            cp -a "$src"/* "$dst/" 2>/dev/null || true
            shopt -u dotglob
          done < /tmp/archives.txt
          echo "::endgroup::"

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-extract: clean + extract [$(date -u +%Y-%m-%dT%H:%M:%SZ)]" || exit 0

          for i in 1 2 3; do
            if git push; then
              echo "Push successful"
              exit 0
            fi
            echo "Push failed ($i/3) — rebasing and retrying"
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep 2
          done

          echo "Failed to push after 3 attempts"
          exit 1
