name: Unpack Into Root (Second Layer)

on:
  push:
    paths:
      - '**/*.zip'
      - '**/*.tar.gz'
      - '**/*.tgz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Unpack newest upload into repo root (extract second layer if wrapped)
        run: |
          set -euo pipefail

          # newest compressed file (by last commit touching the file)
          pack="$(
            git ls-files -z '*.zip' '*.tar.gz' '*.tgz' |
            xargs -0 -n1 |
            xargs -I{} sh -c 'printf "%s\t%s\n" "$(git log -1 --format=%ct -- "{}" 2>/dev/null || echo 0)" "{}"' |
            sort -nr | head -1 | cut -f2-
          )"

          if [ -z "${pack:-}" ]; then
            echo "No .zip/.tar.gz/.tgz found"
            exit 0
          fi

          echo "Using: $pack"

          tmp="$(mktemp -d)"
          out="$tmp/out"
          mkdir -p "$out"

          # unpack into temp
          if [[ "$pack" == *.zip ]]; then
            unzip -o "$pack" -d "$out" >/dev/null
          else
            tar -xzf "$pack" -C "$out"
          fi

          # extract second layer: if unpacked output is a single directory, use its contents as root
          src="$out"
          count="$(ls -A "$out" | wc -l)"
          if [ "$count" -eq 1 ]; then
            only="$(ls -A "$out")"
            if [ -d "$out/$only" ]; then
              echo "Wrapper folder detected ($only) -> using second layer"
              src="$out/$only"
            fi
          fi

          # wipe repo root except workflow and git metadata
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +

          # copy unpacked content into repo root
          shopt -s dotglob
          cp -a "$src"/* .
          shopt -u dotglob

      - name: Commit and push
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unpack into root (second layer)"
          git push
