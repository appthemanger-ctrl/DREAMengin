name: Unpack Into Root (Safe Overlay, Second Layer)

on:
  push:
    paths:
      - '**/*.zip'
      - '**/*.tar.gz'
      - '**/*.tgz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Unpack newest archive into repo root (SAFE overlay)
        shell: bash
        run: |
          set -euo pipefail

          # Find newest archive
          pack="$(
            git ls-files -z '*.zip' '*.tar.gz' '*.tgz' |
            xargs -0 -n1 |
            xargs -I{} sh -c 'printf "%s\t%s\n" "$(git log -1 --format=%ct -- "{}" 2>/dev/null || echo 0)" "{}"' |
            sort -nr | head -1 | cut -f2-
          )"

          if [ -z "${pack:-}" ]; then
            echo "No archive found"
            exit 0
          fi

          echo "Using: $pack"

          tmp="$(mktemp -d)"
          out="$tmp/out"
          mkdir -p "$out"

          # Extract to temp
          if [[ "$pack" == *.zip ]]; then
            unzip -o "$pack" -d "$out" >/dev/null
          else
            tar -xf "$pack" -C "$out"
          fi

          # Remove macOS junk
          rm -rf "$out/__MACOSX" || true

          # Detect wrapper folder
          src="$out"
          count="$(ls -A "$out" | wc -l | tr -d ' ')"

          if [ "$count" -eq 1 ]; then
            only="$(ls -A "$out")"
            if [ -d "$out/$only" ]; then
              echo "Wrapper folder detected: $only"
              src="$out/$only"
            fi
          fi

          # Safety
          if [ -z "$(ls -A "$src" || true)" ]; then
            echo "ERROR: Empty archive"
            exit 1
          fi

          # Get top-level targets
          (cd "$src" && find . -mindepth 1 -maxdepth 1 -printf '%P\n') | sort > "$tmp/targets.txt"

          echo "Targets:"
          cat "$tmp/targets.txt"

          if [ ! -s "$tmp/targets.txt" ]; then
            echo "ERROR: No targets"
            exit 1
          fi

          # Block workflows
          if grep -qx '.github' "$tmp/targets.txt"; then
            echo "ERROR: Archive contains .github"
            exit 1
          fi

          # Delete only replaced targets
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            echo "Removing: ./$entry"
            rm -rf "./$entry"
          done < "$tmp/targets.txt"

          # Copy into root
          echo "Copying into root..."

          shopt -s dotglob
          cp -a "$src"/* .
          shopt -u dotglob

      - name: Commit and push (protect workflows)
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Prevent workflow edits (GitHub blocks these)
          git restore --source=HEAD --staged --worktree .github/workflows || true

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Unpack into root (safe overlay)"
          git push
