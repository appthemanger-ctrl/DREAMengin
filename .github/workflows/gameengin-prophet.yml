name: gameengin-prophet

# Prophet R&D agent. Spec: GameENGINspec.md §3.2 / §4.
on:
  workflow_dispatch:
    inputs:
      target_cartridge: { description: 'Cartridge id', required: false, default: 'mad-maxi' }
      target_genre:     { description: 'Genre key from brain/genre-dna/', required: false, default: 'platformer' }
      target_combo:     { description: 'Comma-separated mechanic ids', required: false, default: 'coyote-time,double-jump,dash,parry' }
permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/gameengin-prophet.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
