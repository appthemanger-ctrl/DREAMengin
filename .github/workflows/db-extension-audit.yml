name: DB Extension Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-extension-audit.yml"
  schedule:
    - cron: '0 3 * * 1'   # weekly Monday 03:00 UTC

jobs:
  audit-db-extensions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Validate DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret is not set."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Print available vs installed extensions
        run: |
          psql "$DATABASE_URL" <<'SQL'
          SET statement_timeout='58s';
          SET idle_session_timeout='58s';

          \echo ''
          \echo '=== INSTALLED EXTENSIONS ==='
          SELECT
            e.name,
            COALESCE(n.nspname, '-') AS schema,
            e.default_version,
            x.extversion AS installed_version,
            e.comment
          FROM
            pg_available_extensions() e(name, default_version, comment)
            LEFT JOIN pg_extension x ON e.name = x.extname
            LEFT JOIN pg_namespace n ON x.extnamespace = n.oid
          WHERE
            x.extname IS NOT NULL
          ORDER BY e.name;

          \echo ''
          \echo '=== AVAILABLE BUT NOT INSTALLED ==='
          SELECT
            e.name,
            e.default_version,
            e.comment
          FROM
            pg_available_extensions() e(name, default_version, comment)
            LEFT JOIN pg_extension x ON e.name = x.extname
          WHERE
            x.extname IS NULL
          ORDER BY e.name;

          \echo ''
          \echo '=== SUMMARY COUNTS ==='
          SELECT
            (SELECT count(*) FROM pg_extension) AS installed_count,
            (SELECT count(*) FROM pg_available_extensions()) AS available_count;
          SQL
