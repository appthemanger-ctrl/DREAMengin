name: Visual Schematic

on:
  push:
    branches: [completedream]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: visual-schematic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sync:
    if: ${{ github.event_name != 'push' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[viz auto]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Build visual schematic assets
        run: pnpm viz:build

      - name: Commit refreshed artifacts
        run: |
          git add VISUAL-SCHEMATIC.md repo-visualizer/graph.json repo-visualizer/graph-stats.json
          if git diff --cached --quiet; then
            echo "No schematic changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(viz): refresh visual schematic [viz auto] [skip vercel]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo-visualizer

  deploy:
    needs: build-sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
