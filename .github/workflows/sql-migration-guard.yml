name: SQL Migration Guard

# ──────────────────────────────────────────────────────────────────────────────
# Scans the live repository (not docs) for Supabase table references that lack a
# migration, scaffolds a migration file when one is missing, automatically
# syncs Supabase on pushes to completedream, regenerates TypeScript types, and
# verifies the Vercel/Next.js build still passes.
#
# Secrets required for full functionality (all optional — steps degrade gracefully):
#   DATABASE_URL       — postgres:// URL used to apply migrations (psql / supabase db push)
#   SUPABASE_DB_URL    — postgres:// URL used to regenerate types (may be the same as above)
#   NEXT_PUBLIC_SUPABASE_URL       — passed to the build step
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY  — passed to the build step
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      force_apply:
        description: "Force-apply all pending migrations even without schema changes"
        type: boolean
        default: false
      full_scan:
        description: "Scan the whole repository instead of only changed files"
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sql-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/sql-migration-guard.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
