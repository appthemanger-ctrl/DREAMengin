name: Idari — Update README

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md' 

jobs:
  update-readme:
    name: Idari refreshes README.md
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (Full History for Changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Changed to 0 to ensure the script can read the last 10 commits

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Pre-Flight: Ensure README exists
        run: |
          if [ ! -f README.md ]; then
            echo "⚠️ README.md missing! Creating baseline template..."
            echo "# DREAMenginOS" > README.md
            echo "\n" >> README.md
            echo "## Current Implementation Status" >> README.md
            echo "## Recent Changes" >> README.md
          fi

      - name: Run update-readme script
        run: node scripts/update-readme.mjs
        env:
          GITHUB_SHA:           ${{ github.sha }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}
          GITHUB_ACTOR:         ${{ github.actor }}
          GITHUB_STEP_SUMMARY:  ${{ env.GITHUB_STEP_SUMMARY }}

      - name: Commit & Push with Rebase Logic
        run: |
          git config user.name  "Idari[bot]"
          git config user.email "idari-bot@users.noreply.github.com"
          
          # Check if the file is empty before adding
          if [ ! -s README.md ]; then
            echo "❌ README.md is empty! Script failed to generate content. Aborting commit."
            exit 1
          fi

          git add README.md
          
          if git diff --cached --quiet; then
            echo "No changes to README.md — skipping commit."
            exit 0
          fi

          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          git commit -m "idari: auto-update README [${SHORT}] [skip ci] [skip vercel]"

          # Robust Push Loop
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}..."
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ README updated successfully."
              exit 0
            fi
            git pull --rebase origin ${{ github.ref_name }}
          done
          echo "❌ Failed to push after 3 attempts."
          exit 1

      - name: Step Summary
        if: always()
        run: |
          echo "## 🤖 Idari[bot] — Session Log" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Engine | Babylon.js 9.0 |" >> "$GITHUB_STEP_SUMMARY"
