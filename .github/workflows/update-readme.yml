name: Update README

# ──────────────────────────────────────────────────────────────────────────────
# Runs after every push to any branch.
# Calls scripts/update-readme.mjs to:
#   • Refresh the "Last updated" line in "## Current Implementation Status"
#   • Prepend a new row in the "## Recent Changes" table (keeps last 10)
#
# The commit is made by github-actions[bot] and tagged [skip ci] so it
# does not re-trigger this workflow.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'   # prevent the bot's own commit from re-triggering

jobs:
  update-readme:
    name: Refresh README.md with latest changes
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the commit back

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2   # need parent commit for diff-tree

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run update-readme script
        run: node scripts/update-readme.mjs
        env:
          GITHUB_SHA:       ${{ github.sha }}
          GITHUB_REF_NAME:  ${{ github.ref_name }}
          GITHUB_ACTOR:     ${{ github.actor }}

      - name: Commit updated README.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to README.md — skipping commit."
            exit 0
          fi

          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          git commit -m "docs: auto-update README [${SHORT}] [skip ci]"

          # Retry push up to 3 times, rebasing on the remote each time to
          # handle concurrent pushes to the same branch (race condition).
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "⚠️  Push attempt ${attempt} failed — pulling and rebasing."
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "❌ Rebase failed. Aborting."
              git rebase --abort 2>/dev/null || true
              exit 1
            }
          done

          echo "❌ All push attempts failed."
          exit 1
