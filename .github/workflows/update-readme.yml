name: Idari — Update README

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
  workflow_dispatch: # This enables the manual "Run workflow" button

jobs:
  update-readme:
    name: Idari refreshes README.md
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pre-Flight: Ensure README exists
        run: |
          if [ ! -f README.md ]; then
            echo "⚠️ README.md missing! Creating baseline template..."
            echo "# DREAMenginOS" > README.md
            echo -e "\n## Current Implementation Status\n## Recent Changes" >> README.md
          fi

      - name: Run update-readme script
        run: node scripts/update-readme.mjs
        env:
          README_UPDATE_USE_GITHUB_CONTEXT: 'true'
          GITHUB_SHA:           ${{ github.sha }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}
          GITHUB_ACTOR:         ${{ github.actor }}
          GITHUB_STEP_SUMMARY:  ${{ env.GITHUB_STEP_SUMMARY }}

      - name: Commit & Push with Rebase Logic
        run: |
          git config user.name  "Idari[bot]"
          git config user.email "idari-bot@users.noreply.github.com"
          
          if [ ! -s README.md ]; then
            echo "❌ README.md is empty! Script failed to generate content."
            exit 1
          fi

          git add README.md
          
          if git diff --cached --quiet; then
            echo "No changes to README.md — skipping commit."
            exit 0
          fi

          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          git commit -m "idari: auto-update README [${SHORT}] [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}..."
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ README updated successfully."
              exit 0
            fi
            git pull --rebase origin ${{ github.ref_name }}
          done
          
          echo "❌ Failed to push after 3 attempts."
          exit 1

      - name: Step Summary
        if: always()
        run: |
          echo "## 🤖 Idari[bot] — Session Log" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
