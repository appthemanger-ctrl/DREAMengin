name: Neural Decision Engine
on:
  workflow_dispatch:
    inputs:
      directive:
        description: 'Optional direction for the decision engine (for example: "push the games shell harder")'
        required: false
        default: ''
        type: string
      commit_changes:
        description: 'Commit validated implementation changes back to the current branch'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '15 7 * * 1'   # weekly Monday 07:15 UTC
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: neural-decision-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/neural-decision-engine.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
