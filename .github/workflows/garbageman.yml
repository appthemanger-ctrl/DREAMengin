name: Cleanup Repo

on:
  push:
    branches: [main, completedream]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Remove junk files
        run: |
          echo "🧹 Cleaning repo..."

          # Remove system junk
          find . -name ".DS_Store" -delete
          find . -name "Thumbs.db" -delete

          # Remove logs
          find . -name "*.log" -delete

          # Remove temp files
          find . -name "*.tmp" -delete
          find . -name "*.swp" -delete

          # Build artifacts and prototype dumps are not removed automatically

      - name: Commit cleanup (if needed)
        run: |
          git config user.name "cleanup-bot"
          git config user.email "cleanup@github.com"

          git add -A

          git diff --cached --quiet || git commit -m "chore: auto cleanup"
          git push || true

      - name: Commit auto-fixes (if any)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No fixes to commit."
            exit 0
          fi

          git add -A
          git commit -m "chore: auto-fix lint"
          git push || true
