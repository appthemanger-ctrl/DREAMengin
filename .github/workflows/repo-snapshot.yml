name: Repo Snapshot

on:
  push:
    branches: ["**"]

jobs:
  snapshot:
    # prevent infinite loop from the bot committing snapshot files
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build snapshot + diff (overwrite)
        shell: bash
        run: |
          set -e

          mkdir -p .ci

          # ✅ Los Angeles timezone
          TZ="America/Los_Angeles"
          NOW="$(TZ=$TZ date '+%Y-%m-%d %H:%M:%S %Z')"

          # Save previous snapshot (if exists) for diff
          if [ -f .ci/snapshot.md ]; then
            cp .ci/snapshot.md /tmp/snapshot_prev.md
          else
            echo "(no previous snapshot)" > /tmp/snapshot_prev.md
          fi

          # Write new snapshot (single file that always gets replaced)
          {
            echo "# Repo Snapshot"
            echo ""
            echo "- Time: $NOW"
            echo "- Repo: $GITHUB_REPOSITORY"
            echo "- Branch: ${GITHUB_REF_NAME:-unknown}"
            echo "- Commit: ${GITHUB_SHA:-unknown}"
            echo ""

            echo "## Key files (root)"
            for f in package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json next.config.js next.config.mjs next.config.ts; do
              if [ -e "$f" ]; then echo "- ✅ $f"; else echo "- ❌ $f"; fi
            done
            echo ""

            echo "## package.json locations (maxdepth 5)"
            echo '```txt'
            find . -maxdepth 5 -name package.json -not -path "./.git/*" | sed 's|^\./||' | sort || true
            echo '```'
            echo ""

            echo "## Root tree (2 levels)"
            echo '```txt'
            find . -maxdepth 2 -mindepth 1 \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -not -path "./.next/*" \
              -print | sed 's|^\./||' | sort
            echo '```'
          } > .ci/snapshot.md

          # Diff against last snapshot (what changed)
          diff -u /tmp/snapshot_prev.md .ci/snapshot.md > .ci/snapshot.diff.txt || true

      - name: Commit snapshot files (only if changed)
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .ci/snapshot.md .ci/snapshot.diff.txt

          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi

          git commit -m "chore(ci): update repo snapshot"
          git push
