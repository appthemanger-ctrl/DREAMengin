name: Repo Snapshot (artifact)

on:
  push:
    branches:
      - completedream
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build snapshot file
        shell: bash
        run: |
          set -e
          mkdir -p .ci

          TZ="America/Los_Angeles"
          NOW="$(TZ=$TZ date '+%Y-%m-%d %H:%M:%S %Z')"

          {
            echo "REPO SNAPSHOT"
            echo "============="
            echo "Time: $NOW"
            echo "Repo: $GITHUB_REPOSITORY"
            echo "Branch: ${GITHUB_REF_NAME:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo ""
            echo "## Root files"
            ls -la
            echo ""
            echo "## Tree (depth 3, excluding heavy dirs)"
            find . -maxdepth 3 -mindepth 1 \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -not -path "./.next/*" \
              -print | sed 's|^\./||' | sort
          } > .ci/snapshot.txt

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot
          path: .ci/snapshot.txt
