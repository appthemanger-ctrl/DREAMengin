name: 🔍 Full Codebase Audit

on:
  workflow_dispatch:
    inputs:
      fail_on_error:
        description: 'Fail the workflow if errors are found?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  audit:
    name: Full Error Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ────────────────────────────────────────────────────────────────
      # SETUP
      # ────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Create audit report directory
        run: mkdir -p audit-reports

      # ────────────────────────────────────────────────────────────────
      # 1. TYPESCRIPT — type errors across every .ts / .tsx file
      # ────────────────────────────────────────────────────────────────
      - name: '[1/12] TypeScript — type check'
        id: typescript
        run: |
          echo "## 1. TypeScript Type Errors" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md
          pnpm tsc --noEmit --pretty false 2>&1 | tee audit-reports/typescript-raw.txt || true
          cat audit-reports/typescript-raw.txt >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          # Count errors
          COUNT=$(grep -c "error TS" audit-reports/typescript-raw.txt || echo 0)
          echo "typescript_errors=$COUNT" >> $GITHUB_OUTPUT
          echo "**TypeScript errors found: $COUNT**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 2. ESLINT — lint every JS / TS / JSX / TSX file
      # ────────────────────────────────────────────────────────────────
      - name: '[2/12] ESLint — lint errors & warnings'
        id: eslint
        run: |
          echo "## 2. ESLint Errors & Warnings" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md
          pnpm eslint . \
            --ext .js,.jsx,.ts,.tsx \
            --format unix \
            --max-warnings 9999 \
            2>&1 | tee audit-reports/eslint-raw.txt || true
          cat audit-reports/eslint-raw.txt >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          ERRORS=$(grep -c ": error " audit-reports/eslint-raw.txt || echo 0)
          WARNINGS=$(grep -c ": warning " audit-reports/eslint-raw.txt || echo 0)
          echo "eslint_errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "eslint_warnings=$WARNINGS" >> $GITHUB_OUTPUT
          echo "**ESLint errors: $ERRORS | warnings: $WARNINGS**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 3. NEXT.JS BUILD — catch build-time failures
      # ────────────────────────────────────────────────────────────────
      - name: '[3/12] Next.js — production build check'
        id: nextbuild
        run: |
          echo "## 3. Next.js Build Errors" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md
          pnpm run build 2>&1 | tee audit-reports/build-raw.txt || true
          cat audit-reports/build-raw.txt >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          # Surface only the error lines
          echo "### Build error lines:" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md
          grep -E "^(Error|error|Type error|×|\s+\^|Failed)" \
            audit-reports/build-raw.txt \
            >> audit-reports/report.md || echo "(none)" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 4. MISSING / BROKEN IMPORTS — files imported but not found
      # ────────────────────────────────────────────────────────────────
      - name: '[4/12] Import resolution — missing modules'
        id: imports
        run: |
          echo "## 4. Missing / Broken Imports" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          # Use typescript diagnostics filtered to "Cannot find module"
          pnpm tsc --noEmit --pretty false 2>&1 \
            | grep -E "Cannot find module|Could not find|has no exported member|is not a module" \
            | sort -u \
            | tee audit-reports/imports-raw.txt \
            >> audit-reports/report.md || true

          COUNT=$(wc -l < audit-reports/imports-raw.txt)
          echo '```' >> audit-reports/report.md
          echo "**Import errors found: $COUNT**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 5. UNUSED EXPORTS — dead exports that are never imported
      # ────────────────────────────────────────────────────────────────
      - name: '[5/12] Dead code — unused exports'
        id: unused_exports
        run: |
          echo "## 5. Unused Exports (dead code)" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          pnpm dlx ts-prune \
            --error \
            2>&1 | tee audit-reports/unused-exports-raw.txt || true

          cat audit-reports/unused-exports-raw.txt >> audit-reports/report.md
          COUNT=$(wc -l < audit-reports/unused-exports-raw.txt)
          echo '```' >> audit-reports/report.md
          echo "**Unused exports found: $COUNT**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 6. CIRCULAR DEPENDENCIES
      # ────────────────────────────────────────────────────────────────
      - name: '[6/12] Circular dependencies'
        id: circular
        run: |
          echo "## 6. Circular Dependencies" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          pnpm dlx madge \
            --circular \
            --extensions ts,tsx \
            --ts-config tsconfig.json \
            . \
            2>&1 | tee audit-reports/circular-raw.txt || true

          cat audit-reports/circular-raw.txt >> audit-reports/report.md
          COUNT=$(grep -c "→\|Circular" audit-reports/circular-raw.txt || echo 0)
          echo '```' >> audit-reports/report.md
          echo "**Circular dependency chains found: $COUNT**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 7. ENV VARIABLE USAGE — .env vars used in code but not declared
      # ────────────────────────────────────────────────────────────────
      - name: '[7/12] Environment variables — undeclared usages'
        id: env_vars
        run: |
          echo "## 7. Environment Variable Issues" >> audit-reports/report.md

          # Collect all declared env keys from .env.example / .env.local.example
          DECLARED_KEYS=""
          for f in .env.example .env.local.example .env.production.example; do
            if [ -f "$f" ]; then
              KEYS=$(grep -oP '^[A-Z_][A-Z0-9_]+(?==)' "$f" || true)
              DECLARED_KEYS="$DECLARED_KEYS $KEYS"
            fi
          done

          echo '```' >> audit-reports/report.md
          echo "Declared keys found in example files:" >> audit-reports/report.md
          echo "$DECLARED_KEYS" | tr ' ' '\n' | sort -u >> audit-reports/report.md
          echo "" >> audit-reports/report.md

          # Find all process.env.XYZ and env.XYZ usages in source
          echo "All env keys referenced in source code:" >> audit-reports/report.md
          grep -rhoP '(?:process\.env\.|env\.)[A-Z_][A-Z0-9_]+' \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            app/ lib/ src/ pages/ components/ 2>/dev/null \
            | sed 's/process\.env\.\|env\.//' \
            | sort -u \
            | tee audit-reports/env-used.txt \
            >> audit-reports/report.md || true

          echo "" >> audit-reports/report.md
          echo "Keys used in code but NOT in any .env.example:" >> audit-reports/report.md
          comm -23 \
            <(sort audit-reports/env-used.txt) \
            <(echo "$DECLARED_KEYS" | tr ' ' '\n' | sort -u) \
            | tee audit-reports/env-missing.txt \
            >> audit-reports/report.md || true

          MISSING=$(wc -l < audit-reports/env-missing.txt)
          echo '```' >> audit-reports/report.md
          echo "**Undeclared env vars used: $MISSING**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 8. SECURITY — hardcoded secrets, API keys, tokens
      # ────────────────────────────────────────────────────────────────
      - name: '[8/12] Security — hardcoded secrets scan'
        id: secrets
        run: |
          echo "## 8. Hardcoded Secrets / Sensitive Strings" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          # gitleaks for secret scanning
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.4_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

          ./gitleaks detect \
            --source . \
            --report-format json \
            --report-path audit-reports/gitleaks-raw.json \
            --no-git \
            --verbose \
            2>&1 | tee audit-reports/gitleaks-stdout.txt || true

          # Pretty-print findings
          if [ -f audit-reports/gitleaks-raw.json ]; then
            node -e "
              const fs = require('fs');
              const findings = JSON.parse(fs.readFileSync('audit-reports/gitleaks-raw.json','utf8') || '[]');
              findings.forEach(f => {
                console.log('FILE: ' + f.File + ':' + f.StartLine);
                console.log('  Rule: ' + f.RuleID);
                console.log('  Match: ' + f.Match.replace(/./g, '*').substring(0,40) + '...');
              });
              console.log('Total: ' + findings.length + ' finding(s)');
            " 2>/dev/null >> audit-reports/report.md || cat audit-reports/gitleaks-stdout.txt >> audit-reports/report.md
          fi

          echo '```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 9. DEPENDENCY VULNERABILITIES — npm audit
      # ────────────────────────────────────────────────────────────────
      - name: '[9/12] Dependencies — vulnerability audit'
        id: deps
        run: |
          echo "## 9. Dependency Vulnerabilities" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          pnpm audit --json 2>/dev/null \
            | node -e "
              const chunks = [];
              process.stdin.on('data', c => chunks.push(c));
              process.stdin.on('end', () => {
                try {
                  const data = JSON.parse(chunks.join(''));
                  const vulns = data.vulnerabilities || {};
                  const byFile = {};
                  Object.entries(vulns).forEach(([pkg, v]) => {
                    const sev = v.severity;
                    const via = (v.via || []).map(x => typeof x === 'string' ? x : x.title || x.url || '?').join(', ');
                    console.log('[' + sev.toUpperCase() + '] ' + pkg + ' — via: ' + via);
                    if (v.nodes) v.nodes.forEach(n => console.log('  used in: ' + n));
                  });
                  const meta = data.metadata || {};
                  console.log('');
                  console.log('Summary: ' + JSON.stringify(meta.vulnerabilities || {}));
                } catch(e) { console.log('Could not parse audit JSON: ' + e.message); }
              });
            " 2>&1 | tee audit-reports/deps-raw.txt \
            >> audit-reports/report.md || true

          echo '```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 10. SUPABASE — detect raw SQL in code, missing RLS hints,
      #     and .from() calls on table names not in types
      # ────────────────────────────────────────────────────────────────
      - name: '[10/12] Supabase — table usage vs type definitions'
        id: supabase
        run: |
          echo "## 10. Supabase Table / RPC Usage Audit" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          echo "=== .from() table references in code ===" >> audit-reports/report.md
          grep -rhoP "\.from\(['\"]([^'\"]+)['\"]\)" \
            --include="*.ts" --include="*.tsx" \
            app/ lib/ src/ pages/ api/ 2>/dev/null \
            | grep -oP "['\"]([^'\"]+)['\"]" \
            | tr -d "'\"\|" \
            | sort -u \
            | tee audit-reports/supabase-tables-used.txt \
            >> audit-reports/report.md || true

          echo "" >> audit-reports/report.md
          echo "=== .rpc() function references in code ===" >> audit-reports/report.md
          grep -rhoP "\.rpc\(['\"]([^'\"]+)['\"]\)" \
            --include="*.ts" --include="*.tsx" \
            app/ lib/ src/ pages/ api/ 2>/dev/null \
            | grep -oP "['\"]([^'\"]+)['\"]" \
            | tr -d "'\"\|" \
            | sort -u \
            | tee audit-reports/supabase-rpcs-used.txt \
            >> audit-reports/report.md || true

          echo "" >> audit-reports/report.md
          echo "=== Tables referenced with 'as never' (bypassed types) ===" >> audit-reports/report.md
          grep -rn "from(.*as never\|'as never'" \
            --include="*.ts" --include="*.tsx" \
            app/ lib/ src/ pages/ api/ 2>/dev/null \
            >> audit-reports/report.md || echo "(none)" >> audit-reports/report.md

          echo "" >> audit-reports/report.md
          echo "=== Routes using 'as unknown as SupabaseClient' (type escape) ===" >> audit-reports/report.md
          grep -rln "as unknown as\|as SupabaseClient\|as ActivitySupabaseClient" \
            --include="*.ts" --include="*.tsx" \
            app/ lib/ src/ pages/ api/ 2>/dev/null \
            >> audit-reports/report.md || echo "(none)" >> audit-reports/report.md

          echo '```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 11. FILE-BY-FILE TYPESCRIPT ERROR BREAKDOWN
      #     (the report everyone actually wants)
      # ────────────────────────────────────────────────────────────────
      - name: '[11/12] Per-file TypeScript error breakdown'
        id: per_file
        run: |
          echo "## 11. Per-File TypeScript Error Breakdown" >> audit-reports/report.md

          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('audit-reports/typescript-raw.txt', 'utf8');
            const lines = raw.split('\n');

            const fileMap = {};
            for (const line of lines) {
              // Match lines like: src/foo/bar.ts(12,5): error TS2345: ...
              const m = line.match(/^(.+\.tsx?)\((\d+),(\d+)\): (error|warning) (TS\d+): (.+)$/);
              if (!m) continue;
              const [, file, ln, col, severity, code, msg] = m;
              if (!fileMap[file]) fileMap[file] = [];
              fileMap[file].push({ ln, col, severity, code, msg });
            }

            const files = Object.keys(fileMap).sort();
            if (files.length === 0) {
              console.log('✅ No TypeScript errors found per file.');
            } else {
              for (const file of files) {
                const errs = fileMap[file];
                console.log('');
                console.log('📄 ' + file + ' (' + errs.length + ' error' + (errs.length > 1 ? 's' : '') + ')');
                for (const e of errs) {
                  console.log('  Line ' + e.ln + ':' + e.col + '  [' + e.code + '] ' + e.msg);
                }
              }
              console.log('');
              console.log('Total files with errors: ' + files.length);
              console.log('Total errors: ' + Object.values(fileMap).reduce((s,a) => s + a.length, 0));
            }
          " 2>&1 | tee audit-reports/per-file-ts.txt

          echo '```' >> audit-reports/report.md
          cat audit-reports/per-file-ts.txt >> audit-reports/report.md
          echo '```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # 12. RUNTIME DANGER PATTERNS — common JS/TS bugs grep'd by pattern
      # ────────────────────────────────────────────────────────────────
      - name: '[12/12] Runtime danger patterns'
        id: patterns
        run: |
          echo "## 12. Runtime Danger Patterns" >> audit-reports/report.md

          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const DIRS = ['app', 'lib', 'src', 'pages', 'api', 'components']
              .filter(d => fs.existsSync(d)).join(' ');

            const patterns = [
              {
                label: 'console.log left in production code',
                grep: 'console\\.log(',
              },
              {
                label: 'TODO / FIXME / HACK / TEMP comments',
                grep: '(TODO|FIXME|HACK|TEMP|XXX):',
              },
              {
                label: 'Non-null assertion (!) — potential runtime crash',
                grep: '[a-zA-Z0-9_>)\\]]\!\\.',
              },
              {
                label: 'Unhandled promise (missing await / .catch)',
                grep: 'new Promise[^;]*\\n?[^;]*without',
              },
              {
                label: '\"as any\" — bypasses all type safety',
                grep: ' as any',
              },
              {
                label: '\"@ts-ignore\" — suppresses TypeScript errors',
                grep: '@ts-ignore',
              },
              {
                label: '\"@ts-nocheck\" — disables TypeScript for whole file',
                grep: '@ts-nocheck',
              },
              {
                label: 'eval() — code injection risk',
                grep: '\\beval\\(',
              },
              {
                label: 'dangerouslySetInnerHTML — XSS risk',
                grep: 'dangerouslySetInnerHTML',
              },
              {
                label: 'Direct process.exit() in app code',
                grep: 'process\\.exit(',
              },
              {
                label: 'setTimeout / setInterval without clearance (potential leak)',
                grep: 'setTimeout\\|setInterval',
              },
              {
                label: 'Math.random() used for IDs/tokens (not cryptographically safe)',
                grep: 'Math\\.random()',
              },
              {
                label: 'Hardcoded localhost URLs',
                grep: 'localhost:[0-9]',
              },
              {
                label: '\"as unknown as\" double-cast (type safety bypass)',
                grep: 'as unknown as',
              },
              {
                label: 'Missing error handling on await (bare await without try/catch)',
                grep: '^\\s*const .* = await (?!.*try)',
              },
              {
                label: 'Empty catch blocks (swallowed errors)',
                grep: '} catch[^{]*{\\s*}',
              },
              {
                label: 'require() inside ESM/TS file (mixing module systems)',
                grep: '\\brequire(',
              },
            ];

            for (const p of patterns) {
              try {
                const out = execSync(
                  'grep -rn --include=\"*.ts\" --include=\"*.tsx\" --include=\"*.js\" -P ' +
                  JSON.stringify(p.grep) + ' ' + DIRS + ' 2>/dev/null | head -30',
                  { encoding: 'utf8', stdio: ['pipe', 'pipe', 'pipe'] }
                ).trim();
                const count = out ? out.split('\n').length : 0;
                console.log('');
                console.log('⚠️  ' + p.label + ' (' + count + ' occurrence' + (count !== 1 ? 's' : '') + ')');
                if (out) {
                  out.split('\n').slice(0, 10).forEach(l => console.log('   ' + l));
                  if (count > 10) console.log('   ... and ' + (count - 10) + ' more');
                }
              } catch(e) {
                // grep returns exit 1 when no matches — that's fine
                console.log('');
                console.log('✅ ' + p.label + ' — none found');
              }
            }
          " 2>&1 | tee audit-reports/patterns-raw.txt

          echo '```' >> audit-reports/report.md
          cat audit-reports/patterns-raw.txt >> audit-reports/report.md
          echo '```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # FINAL SUMMARY — one place to see everything
      # ────────────────────────────────────────────────────────────────
      - name: Build final summary report
        run: |
          SUMMARY_FILE="audit-reports/summary.md"

          echo "# 🔍 Full Codebase Audit Report" > $SUMMARY_FILE
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $SUMMARY_FILE
          echo "Commit: ${{ github.sha }}" >> $SUMMARY_FILE
          echo "Branch: ${{ github.ref_name }}" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "---" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "## 🗂 Quick Summary" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          TS_ERRORS=$(grep -c "error TS" audit-reports/typescript-raw.txt 2>/dev/null || echo 0)
          ESLINT_E=$(grep -c ": error " audit-reports/eslint-raw.txt 2>/dev/null || echo 0)
          ESLINT_W=$(grep -c ": warning " audit-reports/eslint-raw.txt 2>/dev/null || echo 0)
          CIRC=$(grep -c "→\|Circular" audit-reports/circular-raw.txt 2>/dev/null || echo 0)
          UNUSED=$(wc -l < audit-reports/unused-exports-raw.txt 2>/dev/null || echo 0)
          ENV_MISS=$(wc -l < audit-reports/env-missing.txt 2>/dev/null || echo 0)
          FILES_WITH_TS=$(grep -c "📄" audit-reports/per-file-ts.txt 2>/dev/null || echo 0)

          echo "| Check | Result |" >> $SUMMARY_FILE
          echo "|---|---|" >> $SUMMARY_FILE
          echo "| TypeScript errors | $TS_ERRORS |" >> $SUMMARY_FILE
          echo "| Files with TS errors | $FILES_WITH_TS |" >> $SUMMARY_FILE
          echo "| ESLint errors | $ESLINT_E |" >> $SUMMARY_FILE
          echo "| ESLint warnings | $ESLINT_W |" >> $SUMMARY_FILE
          echo "| Circular dependencies | $CIRC |" >> $SUMMARY_FILE
          echo "| Unused exports | $UNUSED |" >> $SUMMARY_FILE
          echo "| Undeclared env vars | $ENV_MISS |" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "---" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          cat audit-reports/report.md >> $SUMMARY_FILE
          cp $SUMMARY_FILE audit-reports/FULL_AUDIT_REPORT.md

          echo "=============================="
          echo "AUDIT SUMMARY"
          echo "=============================="
          cat audit-reports/summary.md | head -30
        continue-on-error: true

      # ────────────────────────────────────────────────────────────────
      # UPLOAD — attach the full report as a downloadable artifact
      # ────────────────────────────────────────────────────────────────
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: full-audit-report-${{ github.run_number }}
          path: audit-reports/
          retention-days: 30
        if: always()

      # ────────────────────────────────────────────────────────────────
      # OPTIONAL FAIL — only fail the workflow if the input says so
      # ────────────────────────────────────────────────────────────────
      - name: Fail workflow if errors found (optional)
        if: ${{ inputs.fail_on_error == 'true' }}
        run: |
          TS_ERRORS=$(grep -c "error TS" audit-reports/typescript-raw.txt 2>/dev/null || echo 0)
          BUILD_FAIL=$(grep -c "Command failed\|exited with code 1" audit-reports/build-raw.txt 2>/dev/null || echo 0)

          if [ "$TS_ERRORS" -gt "0" ] || [ "$BUILD_FAIL" -gt "0" ]; then
            echo "❌ Errors found — failing workflow as requested."
            exit 1
          fi

          echo "✅ No blocking errors found."
