name: Lab Daydream + LabEngin Health

# Builds, updates, checks, and auto-fixes the Lab Daydream and LabEngin.
# Covers: app/daydream/lab/, app/lab/, app/physics-lab/,
#         components/daydream/LabEngin.tsx, components/PhysicsLab.tsx

on:
  push:
    paths:
      - 'app/daydream/lab/**'
      - 'app/lab/**'
      - 'app/physics-lab/**'
      - 'components/daydream/LabEngin.tsx'
      - 'components/PhysicsLab.tsx'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'   # daily 05:00 UTC

permissions:
  contents: write

concurrency:
  group: daydream-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.30.0'
  DAYDREAM: 'lab'
  ENGIN: 'LabEngin'

jobs:
  health:
    name: Lab Daydream · Build · Upgrade · Bug-Check · Fix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Toolchain ─────────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build check ───────────────────────────────────────────────────────────
      - name: Build (Next.js)
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ── Upgrade audit ─────────────────────────────────────────────────────────
      - name: Check for outdated packages
        run: pnpm outdated || true

      - name: Security audit
        run: pnpm audit --audit-level=high || true

      # ── Bug check ─────────────────────────────────────────────────────────────
      - name: Lint (Lab Daydream scope)
        id: lint
        run: |
          pnpm lint \
            --file app/daydream/lab \
            --file app/lab \
            --file app/physics-lab \
            --file components/daydream/LabEngin.tsx \
            || echo "lint_failed=true" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm typecheck || true

      - name: Unit tests
        run: pnpm exec vitest run --reporter=verbose || true

      # ── Auto-fix ──────────────────────────────────────────────────────────────
      - name: ESLint auto-fix (Lab Daydream)
        run: |
          pnpm exec next lint \
            --fix \
            --dir app/daydream/lab \
            --dir app/lab \
            --dir app/physics-lab \
            || true

      # ── Commit fixes ──────────────────────────────────────────────────────────
      - name: Commit auto-fixes (if any)
        run: |
          git config user.name  "daydream-lab-bot"
          git config user.email "daydream-lab-bot@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No fixes to commit."
          else
            git add -A
            git commit -m "fix(lab-daydream): ESLint auto-fix in Lab Daydream + LabEngin [skip ci]"
            git push || true
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Daydream | Lab |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Engine | LabEngin |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
