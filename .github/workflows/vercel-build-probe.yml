name: Vercel Build Probe

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
      - completedream

permissions:
  contents: read

concurrency:
  group: vercel-build-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vercel-equivalent build probe
        id: probe
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set +e
          mkdir -p .ci

          pnpm run vercel-build > .ci/vercel-build-probe.log 2>&1
          exit_code=$?

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          if [ "$exit_code" -eq 0 ]; then
            echo "had_errors=false" >> "$GITHUB_OUTPUT"
            printf "No build errors were detected.\n" > .ci/vercel-build-errors.txt
          else
            echo "had_errors=true" >> "$GITHUB_OUTPUT"
            grep -n -E "Type error:|Error:|ELIFECYCLE|Next\\.js build worker exited|^\\./" .ci/vercel-build-probe.log \
              > .ci/vercel-build-errors.txt || true
            if [ ! -s .ci/vercel-build-errors.txt ]; then
              tail -n 200 .ci/vercel-build-probe.log > .ci/vercel-build-errors.txt
            fi
          fi

          tail -n 200 .ci/vercel-build-probe.log
          exit 0

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build-probe
          path: |
            .ci/vercel-build-probe.log
            .ci/vercel-build-errors.txt

      - name: Write probe summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Vercel Build Probe"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Build script | \`pnpm run vercel-build\` |"
            echo "| Exit code | \`${{ steps.probe.outputs.exit_code }}\` |"
            echo "| Errors detected | \`${{ steps.probe.outputs.had_errors }}\` |"
            echo ""
            echo "### Error excerpt"
            echo '```text'
            tail -n 60 .ci/vercel-build-errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce inverted probe result
        shell: bash
        run: |
          if [ "${{ steps.probe.outputs.exit_code }}" = "0" ]; then
            echo "Build completed without errors, so this probe intentionally fails."
            exit 1
          fi

          echo "Build errors were detected as expected."
          echo "Captured build exit code: ${{ steps.probe.outputs.exit_code }}"
