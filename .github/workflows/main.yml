name: Unzip uploaded ZIP into repo

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP file (anywhere, up to 3 folders deep)
        id: findzip
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "No .zip found."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found zip: $ZIP"

      - name: Unzip into temp folder
        shell: bash
        run: |
          set -e
          rm -rf __unzipped
          mkdir -p __unzipped
          unzip -q "${{ steps.findzip.outputs.zip }}" -d __unzipped
          echo "Top of __unzipped:"
          ls -la __unzipped | head -n 50

      - name: Locate project root (folder containing package.json)
        id: root
        shell: bash
        run: |
          set -e
          ROOT="$(find __unzipped -maxdepth 6 -type f -name package.json -print | head -n 1 || true)"
          if [ -z "$ROOT" ]; then
            echo "Could not find package.json inside the zip."
            echo "Listing some files for debugging:"
            find __unzipped -maxdepth 4 -type f | head -n 200
            exit 1
          fi
          ROOT_DIR="$(dirname "$ROOT")"
          echo "root=$ROOT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project root: $ROOT_DIR"

      - name: Replace repo contents with extracted project
        shell: bash
        run: |
          set -e

          # Remove everything except .git and .github
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # Copy extracted project into repo root (including dotfiles)
          shopt -s dotglob
          cp -R "${{ steps.root.outputs.root }}"/* .

          # Remove zips (we don't want zips in the repo afterwards)
          find . -maxdepth 3 -type f -name "*.zip" -delete

          # Cleanup temp
          rm -rf __unzipped

      - name: Commit and push extracted files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep .; then
            git add -A
            git commit -m "Extract project ZIP into repo"
            git push
          else
            echo "No changes to commit."
          fi
