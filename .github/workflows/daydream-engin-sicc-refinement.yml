name: Daydream Lobby + Engin Runtime SICC UI Refinement

# Runs the full Stylized · Intuitive · Cohesive · Coherent quality pass
# against a specific Daydream-lobby + Engin-runtime pair surface.
#
# Triggered:
#   - Automatically by the build-cycle workflow when a pair reaches REFINE phase
#   - On push to Engin runtime component files (for pairs already in REFINE)
#   - Manually via workflow_dispatch for targeted polish sprints
#
# Covers:
#   ✦ Stylized  — design tokens, DreamWord treatment, premium gradients
#   ◈ Intuitive — ARIA labels, hover/focus states, press feedback
#   ◎ Cohesive  — accent tokens, border-radius, transition timing
#   ◇ Coherent  — canonical naming, bridge emits, back-navigation
on:
  workflow_call:
    inputs:
      daydream:
        required: true
        type: string
      engin:
        required: true
        type: string
      engin_file:
        required: true
        type: string
      daydream_path:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      daydream:
        description: 'Daydream lobby domain (Music|Games|Lab|Code|Brand|Create)'
        required: true
        default: 'Music'
      engin:
        description: 'Engin runtime surface name'
        required: true
        default: 'StarMakerEngin'
      engin_file:
        description: 'Path to Engin runtime component file'
        required: true
        default: 'components/daydream/StarMakerEngin.tsx'
      daydream_path:
        description: 'Path to Daydream app directory'
        required: true
        default: 'app/daydream/music'
permissions:
  contents: write
concurrency:
  group: sicc-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/daydream-engin-sicc-refinement.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
