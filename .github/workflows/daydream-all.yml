name: Daydream Lobbies — All Health & Feature Scans

# Combined replacement for the six individual daydream-*.yml workflows:
#   daydream-music.yml · daydream-games.yml · daydream-lab.yml
#   daydream-code.yml  · daydream-brand.yml · daydream-create.yml
#
# Runs all six Daydream lobby health checks as a single matrix workflow.
# One workflow entry in the Actions tab instead of six.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'   # weekly Monday 02:00 UTC
permissions:
  contents: write
concurrency:
  group: daydream-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/daydream-all.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
