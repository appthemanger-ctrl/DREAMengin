name: gameengin-upgrader

# Upgrader maintenance agent. Spec: GameENGINspec.md §6 (Agent Profile).

on:
  workflow_dispatch:
    inputs:
      target_cartridge: { description: 'Cartridge id (omit to survey all)', required: false, default: '' }

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_CARTRIDGE: ${{ github.event.inputs.target_cartridge }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run Upgrader
        run: pnpm tsx scripts/gameengin/upgrader-run.ts
      - name: Upload upgrader output
        uses: actions/upload-artifact@v4
        with:
          name: upgrader-${{ github.event.inputs.target_cartridge || 'all' }}
          path: |
            .gameengin-upgrader-output.json
            lib/gameengin/brain/upgrade-history/**
