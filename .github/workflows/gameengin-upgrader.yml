name: gameengin-upgrader

# Upgrader maintenance agent. Spec: GameENGINspec.md §6 (Agent Profile).
on:
  workflow_dispatch:
    inputs:
      target_cartridge: { description: 'Cartridge id (omit to survey all)', required: false, default: '' }
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: ./.github/actions/resilient-engine
        with:
          ruleset: .github/ruleset/gameengin-upgrader.yml
          allow-failure: 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
