name: Extract zip and flatten into repo root (no status)

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip -> flatten -> sync -> commit
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zips=( *.zip )
          shopt -u nullglob
          if [ ${#zips[@]} -eq 0 ]; then
            exit 0
          fi

          IFS=$'\n' zips_sorted=($(printf "%s\n" "${zips[@]}" | sort))
          unset IFS
          ZIP="${zips_sorted[-1]}"

          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          # flatten wrapper folder if there is exactly one top-level dir (ignoring __MACOSX)
          ROOT="$TMP"
          top_dirs=()
          for d in "$TMP"/*; do
            [ -d "$d" ] || continue
            [ "$(basename "$d")" = "__MACOSX" ] && continue
            top_dirs+=( "$d" )
          done
          if [ "${#top_dirs[@]}" -eq 1 ]; then
            ROOT="${top_dirs[0]}"
          fi

          # delete the zip from the repo
          rm -f "$ZIP"
          git rm -f "$ZIP" 2>/dev/null || true

          # sync contents into repo root (protect git internals)
          rsync -a \
            --exclude ".git/" \
            --exclude ".github/" \
            "$ROOT/" "./"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract zip and flatten" || exit 0
          git push
