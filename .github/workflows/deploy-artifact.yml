name: Deploy Artifact

on:
  push:
    paths:
      - "DREAMENGIN-v*.zip"
      - "DREAMENGIN-v*.tar.gz"
      - "DREAMENGIN-v*.tgz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Unpack newest SemVer artifact + validate + delete archive
        shell: bash
        run: |
          set -euo pipefail

          candidates="$(git ls-files -z \
            'DREAMENGIN-v[0-9]*.[0-9]*.[0-9]*.zip' \
            'DREAMENGIN-v[0-9]*.[0-9]*.[0-9]*.tar.gz' \
            'DREAMENGIN-v[0-9]*.[0-9]*.[0-9]*.tgz' \
            | xargs -0 -n1 || true)"

          [ -z "${candidates:-}" ] && exit 0

          pack="$(
            printf "%s\n" "$candidates" |
            xargs -I{} sh -c 'printf "%s\t%s\n" "$(git log -1 --format=%ct -- "{}" 2>/dev/null || echo 0)" "{}"' |
            sort -nr | head -1 | cut -f2-
          )"

          tmp="$(mktemp -d)"
          out="$tmp/out"
          mkdir -p "$out"

          if [[ "$pack" == *.zip ]]; then unzip -o "$pack" -d "$out" >/dev/null; else tar
