name: Extract zip and publish (2nd level)

on:
  # Manual trigger (Actions -> Run workflow)
  workflow_dispatch:
    inputs:
      zip_glob:
        description: "Zip pattern in repo root"
        required: false
        default: "*.zip"
      extract_source:
        description: "Folder inside extracted root to publish (use '.' for everything)"
        required: true
        default: "." 
      destination_path:
        description: "Repo path to publish into"
        required: false
        default: "."
      zip_index:
        description: "Which zip to use if multiple match (0 = first)"
        required: false
        default: "0"

  # Auto trigger when a zip is pushed to repo root
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

concurrency:
  group: extract-zip-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract zip, use 2nd-level root, publish
        shell: bash
        env:
          ZIP_GLOB: ${{ inputs.zip_glob || '*.zip' }}
          EXTRACT_SOURCE: ${{ inputs.extract_source || '.' }}
          DESTINATION_PATH: ${{ inputs.destination_path || '.' }}
          ZIP_INDEX: ${{ inputs.zip_index || '0' }}
        run: |
          set -euo pipefail

          echo "Looking for zip(s) in repo root matching: ${ZIP_GLOB}"
          shopt -s nullglob
          zips=( ${ZIP_GLOB} )
          shopt -u nullglob

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found. Nothing to do."
            exit 0
          fi

          # Sort for deterministic selection
          IFS=$'\n' zips_sorted=($(printf "%s\n" "${zips[@]}" | sort))
          unset IFS

          if ! [[ "${ZIP_INDEX}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: zip_index must be a non-negative integer (got: ${ZIP_INDEX})"
            exit 1
          fi

          if [ "${ZIP_INDEX}" -ge "${#zips_sorted[@]}" ]; then
            echo "ERROR: zip_index ${ZIP_INDEX} out of range. Found ${#zips_sorted[@]} zip(s):"
            printf " - %s\n" "${zips_sorted[@]}"
            exit 1
          fi

          ZIP_FILE="${zips_sorted[${ZIP_INDEX}]}"
          echo "Using zip: ${ZIP_FILE}"

          WORKDIR="$(mktemp -d)"
          EXTRACT_DIR="${WORKDIR}/extract"
          TEMP_DIR="${WORKDIR}/temp_publish"
          mkdir -p "${EXTRACT_DIR}" "${TEMP_DIR}"

          echo "Unzipping ${ZIP_FILE} -> ${EXTRACT_DIR}"
          unzip -q "${ZIP_FILE}" -d "${EXTRACT_DIR}"

          echo "Top-level extracted entries:"
          ls -la "${EXTRACT_DIR}"

          # ---- 2nd-level root detection ----
          # If the zip contains exactly ONE top-level directory and no top-level files,
          # treat that directory as the "real" root (second level).
          ROOT="${EXTRACT_DIR}"
          top_dirs="$(find "${EXTRACT_DIR}" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          top_files="$(find "${EXTRACT_DIR}" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"

          if [ "${top_files}" -eq 0 ] && [ "${top_dirs}" -eq 1 ]; then
            WRAPPER="$(find "${EXTRACT_DIR}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            echo "Wrapper folder detected. Using second-level root: ${WRAPPER}"
            ROOT="${WRAPPER}"
          else
            echo "No wrapper folder detected. Using extracted root: ${ROOT}"
          fi
          # ---------------------------------

          echo "Using ROOT: ${ROOT}"
          echo "EXTRACT_SOURCE: ${EXTRACT_SOURCE}"
          echo "DESTINATION_PATH: ${DESTINATION_PATH}"

          # Resolve source folder under ROOT
          SRC_PATH="${ROOT}"
          if [ "${EXTRACT_SOURCE}" != "." ]; then
            if [ -d "${ROOT}/${EXTRACT_SOURCE}" ]; then
              SRC_PATH="${ROOT}/${EXTRACT_SOURCE}"
            else
              echo "ERROR: '${EXTRACT_SOURCE}' not found under ${ROOT}"
              echo "Contents of ROOT:"
              ls -la "${ROOT}"
              exit 1
            fi
          fi

          echo "Staging: ${SRC_PATH} -> ${TEMP_DIR}"
          rsync -a --delete "${SRC_PATH}/" "${TEMP_DIR}/"

          echo "Deleting zip from repo: ${ZIP_FILE}"
          rm -f "${ZIP_FILE}"
          git rm -f "${ZIP_FILE}" 2>/dev/null || true

          echo "Publishing: ${TEMP_DIR} -> ${DESTINATION_PATH}"
          mkdir -p "${DESTINATION_PATH}"
          rsync -a --delete "${TEMP_DIR}/" "${DESTINATION_PATH}/"

          echo "Git status:"
          git status --porcelain

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Publish from ${ZIP_FILE} (${EXTRACT_SOURCE} -> ${DESTINATION_PATH}) [skip ci]" || exit 0
          git push
