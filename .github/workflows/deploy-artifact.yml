name: Extract zip and flatten into repo root

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip -> flatten 1st folder -> sync to repo root
        shell: bash
        run: |
          set -euo pipefail

          # Find zip in repo root
          shopt -s nullglob
          zips=( *.zip )
          shopt -u nullglob

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found."
            exit 0
          fi

          ZIP="${zips[0]}"
          echo "Using zip: $ZIP"

          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          echo "Top-level after unzip:"
          ls -la "$TMP"

          # If exactly ONE top-level directory and ZERO top-level files,
          # publish the contents inside that directory (iOS-style wrapper).
          dir_count=0
          file_count=0
          only_dir=""

          for p in "$TMP"/*; do
            [ -d "$p" ] && dir_count=$((dir_count+1)) && only_dir="$p"
            [ -f "$p" ] && file_count=$((file_count+1))
          done

          if [ "$dir_count" -eq 1 ] && [ "$file_count" -eq 0 ]; then
            SRC="$only_dir"
            echo "Flattening single top folder: $SRC"
          else
            SRC="$TMP"
            echo "Using unzip root directly: $SRC"
          fi

          # Delete the zip from the repo
          rm -f "$ZIP"
          git rm -f "$ZIP" 2>/dev/null || true

          # Sync into repo root, but protect git internals
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            "$SRC/" "./"

          echo "Git status:"
          git status --porcelain

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract zip and flatten"
          git push
