name: Unzip and publish contents

on:
  push:
    # Only trigger when a zip at the repo root is added/changed/removed.
    # If you use a specific name, set it like: ['upload.zip']
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unzip_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip, stage to temp, delete zip, publish
        shell: bash
        env:
          # ---- CONFIG ----
          ZIP_GLOB: "*.zip"                 # zip(s) expected at repo root
          SOURCE_SUBFOLDER: "dist"          # folder inside the zip to publish (example: "dist")
          DESTINATION_PATH: "published"     # where to put files in the repo (example: repo root "." or "apps/web")
          # ----------------
        run: |
          set -euo pipefail

          echo "Looking for zip(s) in repo root matching: ${ZIP_GLOB}"
          shopt -s nullglob
          zips=( ${ZIP_GLOB} )
          shopt -u nullglob

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found. Nothing to do."
            exit 0
          fi

          # If multiple zips exist, process the first one (you can change this logic).
          ZIP_FILE="${zips[0]}"
          echo "Using zip: ${ZIP_FILE}"

          WORKDIR="$(mktemp -d)"
          EXTRACT_DIR="${WORKDIR}/extract"
          TEMP_DIR="${WORKDIR}/temp_publish"

          mkdir -p "${EXTRACT_DIR}" "${TEMP_DIR}"

          echo "Unzipping ${ZIP_FILE} -> ${EXTRACT_DIR}"
          unzip -q "${ZIP_FILE}" -d "${EXTRACT_DIR}"

          # Find the source subfolder inside the extracted content.
          # This handles cases where the zip contains a top-level wrapper folder.
          echo "Searching for source folder inside zip: ${SOURCE_SUBFOLDER}"
          SRC_PATH=""
          if [ -d "${EXTRACT_DIR}/${SOURCE_SUBFOLDER}" ]; then
            SRC_PATH="${EXTRACT_DIR}/${SOURCE_SUBFOLDER}"
          else
            # search one level deeper and beyond
            match="$(find "${EXTRACT_DIR}" -type d -name "${SOURCE_SUBFOLDER}" -print -quit || true)"
            if [ -n "${match}" ]; then
              SRC_PATH="${match}"
            fi
          fi

          if [ -z "${SRC_PATH}" ]; then
            echo "ERROR: Could not find folder '${SOURCE_SUBFOLDER}' inside the zip."
            echo "Top-level extracted entries:"
            ls -la "${EXTRACT_DIR}"
            exit 1
          fi

          echo "Found source folder: ${SRC_PATH}"
          echo "Copying contents -> temp staging: ${TEMP_DIR}"
          rsync -a --delete "${SRC_PATH}/" "${TEMP_DIR}/"

          echo "Deleting zip from repo: ${ZIP_FILE}"
          rm -f "${ZIP_FILE}"
          git rm -f "${ZIP_FILE}" 2>/dev/null || true

          echo "Publishing temp contents -> repo destination: ${DESTINATION_PATH}"
          mkdir -p "${DESTINATION_PATH}"
          rsync -a --delete "${TEMP_DIR}/" "${DESTINATION_PATH}/"

          echo "Git status:"
          git status --porcelain

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # Use a commit message that can optionally skip CI tools that respect [skip ci]
          git commit -m "Publish contents from ${ZIP_FILE} [skip ci]" || exit 0

          echo "Pushing changes..."
          git push
