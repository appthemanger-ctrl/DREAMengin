name: Auto Extract Archives

on:
  push:
    paths:
      - '**.zip'
      - '**.tar.gz'
      - '**.tgz'

  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

      - name: Find archive (must be exactly one)
        run: |
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) > /tmp/archive.txt

          count=$(wc -l < /tmp/archive.txt)

          if [ "$count" -eq 0 ]; then
            echo "No archive found — exiting"
            exit 0
          fi

          if [ "$count" -ne 1 ]; then
            echo "❌ ERROR: Exactly one archive allowed"
            cat /tmp/archive.txt
            exit 1
          fi

      - name: Extract and replace project files (SAFE)
        run: |
          set -e

          archive=$(cat /tmp/archive.txt)
          tmpdir=$(mktemp -d)

          if [[ "$archive" == *.zip ]]; then
            unzip -q "$archive" -d "$tmpdir"
          else
            tar -xzf "$archive" -C "$tmpdir"
          fi

          # Detect single-root project
          roots=$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d ! -name "__MACOSX")
          files=$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type f)

          if [ -z "$files" ] && [ "$(echo "$roots" | wc -l)" -eq 1 ]; then
            src="$roots"
          else
            src="$tmpdir"
          fi

          # DELETE ONLY NON-SYSTEM FILES
          for item in * .*; do
            case "$item" in
              "."|".."|".git"|".github") ;;
              *) rm -rf "$item" ;;
            esac
          done

          # Move extracted project into repo root
          mv "$src"/* .

          # Cleanup
          rm -rf "$tmpdir" "$archive"

      - name: Commit updated repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "auto-extract: replace repo contents with archive (safe)"
          git push
